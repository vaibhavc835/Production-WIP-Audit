<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Audit | Production WIP Audit</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="js/wip-core.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <style>
    html,body{margin:0;background:#0b1220}
    #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0b1220,#12304f);color:#cbd5e1;font:15px 'Segoe UI',system-ui,sans-serif}
    #boot i{display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#4ade80;animation:bootspin .8s linear infinite}
    #boot p{margin-top:10px;max-width:300px;font-size:13.5px;color:#94a3b8}
    @keyframes bootspin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
  </style>
</head>
<body>
<div id="boot" role="status"><div><i></i>Loading Production WIP Audit…</div></div>
<script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b) b.firstElementChild.insertAdjacentHTML('beforeend', '<p>This is taking longer than usual. Check your internet connection, then reload the page.</p>');
  }, 12000);
</script>
<script type="module">
  import {
    startPage, icon, esc, toast, openModal, friendlyError,
    listStations, listColl, getMaster, auditPlacesFromMaster, listAuditForms, listAuditResponses, submitAudit, dayKeyOf, scopeLabel
  } from './js/wip-core.js';
  import { renderSheet, sheetTableHtml } from './js/audit-sheet.js';

  const ctx = await startPage({ active: 'audit', title: 'Audit' });
  const main = ctx.main;

  const st = document.createElement('style');
  st.textContent = `
  .aud [hidden]{display:none!important}
  .aud .forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .aud .fcard{background:#fff;border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .aud .fcard:hover{box-shadow:0 2px 12px rgba(15,23,42,.1)}
  .aud .fcard b{font-size:16px}.aud .fcard span{color:var(--muted);font-size:13.5px}
  .aud h2.sec{font-size:16px;margin:26px 0 10px}
  .aud .gf{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .aud .gc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .aud .gc.head{border-top:8px solid var(--navy)}
  .aud .gc.head h1{margin:0 0 6px;font-size:24px}
  .aud .gc.bad{border-color:#dc2626;box-shadow:0 0 0 1px #dc2626}
  .aud .gc .q{font-weight:600;font-size:15.5px;margin-bottom:8px}.aud .gc .q i{color:#dc2626;font-style:normal}
  .aud .crit{background:#f1f5f9;border-left:4px solid #94a3b8;border-radius:6px;padding:8px 12px;margin:0 0 12px;font-size:14px;white-space:pre-wrap}
  .aud .crit small{display:block;color:var(--muted);font-weight:600;margin-bottom:2px}
  .aud .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .aud .opt{position:relative}
  .aud .opt input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
  .aud .opt span{display:inline-block;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px;background:#fff;color:var(--ink2)}
  .aud .opt input:focus-visible+span{outline:2px solid #2563eb;outline-offset:2px}
  .aud .opt input:checked+span.ok{background:#dcfce7;border-color:#16a34a;color:#166534}
  .aud .opt input:checked+span.nok{background:#fee2e2;border-color:#dc2626;color:#991b1b}
  .aud .opt input:checked+span.na{background:#e2e8f0;border-color:#64748b;color:#334155}
  .aud .err2{color:#b91c1c;font-size:13px;margin-top:6px}
  .aud .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .aud .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f1f5f9;color:#334155;white-space:nowrap}
  .aud .pill.red{background:#fee2e2;color:#991b1b}.aud .pill.green{background:#dcfce7;color:#166534}.aud .pill.grey{background:#e2e8f0}
  .aud .big{font-size:34px;font-weight:700}
  .aud .rtbl td small{color:var(--muted)}
  .aud .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 16px}
  .aud .kp .k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;border-left:5px solid #cbd5e1}
  .aud .kp .k small{display:block;color:var(--muted);font-weight:600;font-size:12px}.aud .kp .k b{font-size:26px;font-variant-numeric:tabular-nums}
  .aud .kp .k.good{border-left-color:#16a34a}.aud .kp .k.mid{border-left-color:#d97706}.aud .kp .k.low{border-left-color:#dc2626}
  .aud .sbar{margin:0 0 12px}.aud .sbar input{max-width:360px}
  .aud .fcard{border-top:1px solid var(--line);border-left:6px solid var(--navy);gap:8px;transition:transform .12s,box-shadow .12s}.aud .fcard:hover{transform:translateY(-2px)}
  .aud .fcard .ft{display:flex;align-items:center;gap:8px}.aud .fcard .fic{width:32px;height:32px;border-radius:9px;background:#e0f2fe;color:#075985;display:grid;place-items:center}.aud .fcard .fic svg{width:18px;height:18px}
  .aud .fcard .fk{font-size:12px;font-weight:700;color:#075985}.aud .fcard .fd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .aud .fcard .fm{font-size:12.5px}.aud .fcard .ff2{display:flex;align-items:center;gap:10px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--line);color:var(--ink2)}
  .aud .fcard .fl2{font-size:13px;line-height:1.3;flex:1}.aud .fcard .fl2 small{color:var(--muted)}
  .aud .fcard .go{background:var(--navy);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:13px}
  .aud .ring{--c:#94a3b8;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),#e2e8f0 0);position:relative}
  .aud .ring::before{content:'';position:absolute;inset:15%;background:#fff;border-radius:50%}.aud .ring b{position:relative;font-size:11px;color:#0f172a}
  .aud .ring.good{--c:#16a34a}.aud .ring.mid{--c:#d97706}.aud .ring.low{--c:#dc2626}
  .aud .tabs2{display:flex;gap:6px;margin:0 0 10px}.aud .tabs2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer}.aud .tabs2 button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .aud .rl{display:flex;flex-direction:column;gap:8px}.aud .rr{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;width:100%}.aud .rr:hover{background:#f8fafc}
  .aud .rr .rm{flex:1;min-width:0}.aud .rr .rm b{display:block}.aud .rr .rm small{color:var(--muted)}.aud .rr .rc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .aud .hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}.aud .hero .ring{width:84px;height:84px}.aud .hero .ring b{font-size:18px}
  @media (max-width:640px){.aud .rr{flex-wrap:wrap}.aud .rr .rc{justify-content:flex-start}}
  @media (max-width:640px){.aud .gc{padding:14px}.aud .opt span{padding:8px 13px}}
  `;
  document.head.appendChild(st);

  /* ---------- helpers ---------- */
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const when = (r) => { const d = r.createdAt?.toDate?.(); return d ? `${String(d.getDate()).padStart(2, '0')}-${MON[d.getMonth()]}-${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '-'; };
  const clean = (v) => String(v ?? '').replace(/\s+/g, ' ').trim();
  const RESULT = { ok: ['Meets criteria', 'green'], nok: ['Does not meet', 'red'], na: ['Not applicable', 'grey'] };

  main.innerHTML = '<div class="aud" id="aud"><div class="empty">Loading…</div></div>';
  const root = main.querySelector('#aud');

  let forms = [], places = new Map();   // places: department -> Set of lines
  async function loadBase() {
    const [f, m] = await Promise.all([listAuditForms(), getMaster().catch(() => ({ has: false, stations: [] }))]);
    forms = f.filter((x) => x.active !== false);
    const add = (d, l) => { d = clean(d); l = clean(l); if (!d) return; if (!places.has(d)) places.set(d, new Set()); if (l) places.get(d).add(l); };
    if (m.has) auditPlacesFromMaster(m).forEach((lines, d) => lines.forEach((l) => add(d, l)));
    else { const [inv, iss] = await Promise.all([listStations().catch(() => []), listColl('issueStations').catch(() => [])]); inv.forEach((s) => add(s.department, s.line)); iss.forEach((s) => add(s.area, s.line)); }
  }
  try { await loadBase(); } catch (e) { root.innerHTML = `<div class="empty"><b>Could not load the audit forms.</b><p>${esc(friendlyError(e))}</p></div>`; throw e; }

  /* ---------- landing: summary, forms, results ---------- */
  const scoreTone = (v) => (v == null ? 'na' : v >= 90 ? 'good' : v >= 70 ? 'mid' : 'low');
  const ring = (v, size = 46) => `<span class="ring ${scoreTone(v)}" style="--p:${v == null ? 0 : v};width:${size}px;height:${size}px"><b>${v == null ? '–' : v + '%'}</b></span>`;
  const todayKey = () => dayKeyOf(new Date());
  let LF = { q: '', mine: false, form: '' };
  async function showList() {
    root.innerHTML = `<div class="page-head"><div><h1>Audit</h1><p class="sub">Pick a form, fill it in on the shop floor and submit. Your name, the date and the time are recorded for you.</p></div>
      ${ctx.isAdmin ? '<a class="btn btn-ghost" href="admin.html#auditforms">Manage audit forms</a>' : ''}</div>
      <div class="kp" id="kp"></div>
      <div class="sbar"><input id="fq" type="search" placeholder="Search audit forms" aria-label="Search audit forms" value="${esc(LF.q)}"></div>
      <div class="forms" id="fl"></div>
      <h2 class="sec">Audit results</h2>
      <div class="tabs2"><button type="button" data-m="0" class="${LF.mine ? '' : 'on'}">Everyone</button><button type="button" data-m="1" class="${LF.mine ? 'on' : ''}">My audits</button></div>
      <div id="recent"><div class="empty">Loading…</div></div>`;
    let rows = [];
    try { rows = await listAuditResponses({ max: 300 }); } catch (e) { root.querySelector('#recent').innerHTML = `<div class="empty">${esc(friendlyError(e))}</div>`; }
    const month = todayKey().slice(0, 7), mm = rows.filter((r) => (r.auditDate || r.dateKey || '').startsWith(month));
    const scored = mm.filter((r) => r.score != null), avg = scored.length ? Math.round(scored.reduce((a, r) => a + r.score, 0) / scored.length) : null;
    const nok = mm.reduce((a, r) => a + (r.counts?.nok || 0), 0), mine = mm.filter((r) => r.auditorUid === ctx.uid).length;
    root.querySelector('#kp').innerHTML = [['Audits this month', mm.length, ''], ['Average score', avg == null ? '–' : avg + '%', scoreTone(avg)], ['Findings (not OK)', nok, nok ? 'low' : 'good'], ['Done by you', mine, '']]
      .map(([l, v, t]) => `<div class="k ${t}"><small>${l}</small><b>${v}</b></div>`).join('');
    const lastOf = (id) => rows.find((r) => r.formId === id);
    const drawForms = () => {
      const q = LF.q.toLowerCase(), list = forms.filter((f) => !q || (f.title + ' ' + (f.description || '') + ' ' + (f.formNo || '')).toLowerCase().includes(q));
      root.querySelector('#fl').innerHTML = list.length ? list.map((f) => { const l = lastOf(f.id), n = f.kind === 'sheet' ? (f.rowMode === 'free' ? 'Checksheet · add rows as you go' : 'Checksheet · ' + (f.rows || []).filter((x) => !x.g).length + ' check points') : (f.points || []).length + ' audit points';
        return `<button type="button" class="fcard" data-id="${esc(f.id)}"><span class="ft"><span class="fic">${icon('clipboard')}</span><span class="fk">${f.kind === 'sheet' ? 'Checksheet' : 'Audit'}</span></span><b>${esc(f.title)}</b>
          ${f.description ? `<span class="fd">${esc(f.description)}</span>` : ''}<span class="fm">${esc(n)}${f.formNo ? ' · ' + esc(f.formNo) : ''}</span>
          <span class="ff2">${l ? `${ring(l.score, 38)}<span class="fl2">Last audit ${esc(when(l).slice(0, 11))}<br><small>by ${esc(l.auditorName)}</small></span>` : '<span class="fl2"><small>Not audited yet</small></span>'}<span class="go">Start</span></span></button>`; }).join('')
        : `<div class="empty"><b>${forms.length ? 'No form matches.' : 'No audit form yet.'}</b><p>${forms.length ? 'Try another word.' : (ctx.isAdmin ? 'Create one in Admin Control, Audit Forms.' : 'The administrator has not created an audit form yet.')}</p></div>`;
      root.querySelectorAll('.fcard').forEach((b) => { b.onclick = () => { location.hash = 'form=' + b.dataset.id; }; });
    };
    const drawRows = () => {
      const list = rows.filter((r) => !LF.mine || r.auditorUid === ctx.uid).slice(0, 30), box = root.querySelector('#recent');
      box.innerHTML = list.length ? `<div class="rl">${list.map((r) => `<button type="button" class="rr" data-id="${esc(r.id)}">${ring(r.score, 44)}<span class="rm"><b>${esc(r.formTitle)}</b><small>${esc(when(r))}${r.department ? ' · ' + esc(r.department) + (r.line ? ' › ' + esc(r.line) : '') : ''} · ${esc(r.auditorName)}</small></span>
        <span class="rc"><span class="pill green">${r.counts?.ok ?? 0} OK</span>${r.counts?.nok ? `<span class="pill red">${r.counts.nok} not OK</span>` : ''}</span></button>`).join('')}</div><div class="note">Latest ${list.length} results. Select one to see the details.</div>`
        : '<div class="empty">No audits yet.</div>';
      box.querySelectorAll('.rr').forEach((tr) => { tr.onclick = () => detail(rows.find((r) => r.id === tr.dataset.id)); });
    };
    drawForms(); drawRows();
    root.querySelector('#fq').oninput = (e) => { LF.q = e.target.value; drawForms(); };
    root.querySelectorAll('.tabs2 button').forEach((b) => { b.onclick = () => { LF.mine = b.dataset.m === '1'; root.querySelectorAll('.tabs2 button').forEach((x) => x.classList.toggle('on', x === b)); drawRows(); }; });
  }

  function detail(r) {
    if (!r) return;
    if (r.kind === 'sheet') {
      openModal({
        title: r.formTitle, wide: true,
        html: `<div class="hero">${ring(r.score)}<div><span class="pill green">${r.counts?.ok ?? 0} OK</span> <span class="pill red">${r.counts?.nok ?? 0} NOT OK</span></div></div><p class="hint">${esc(when(r))} · audit date ${esc(r.auditDate || '')}${r.auditTime ? ' ' + esc(r.auditTime) : ''}${r.durationMin ? ' · took ' + r.durationMin + ' min' : ''}${r.auditorArea ? ' · area ' + esc(r.auditorArea) : ''}${r.department ? ' · ' + esc(r.department) + ' · ' + esc(r.line) : ''} · audited by ${esc(r.auditorName)}${r.auditorEmployeeId ? ' (' + esc(r.auditorEmployeeId) + ')' : ''}</p>
          ${(r.headerValues || []).filter((h) => h.value).length ? `<p>${r.headerValues.filter((h) => h.value).map((h) => `<b>${esc(h.label)}:</b> ${esc(h.value)}`).join(' &nbsp; ')}</p>` : ''}
          <p><span class="pill green">${r.counts?.ok ?? 0} OK</span> <span class="pill red">${r.counts?.nok ?? 0} NOT OK</span> ${r.score != null ? `<b style="margin-left:8px">Score ${r.score}%</b>` : ''}</p>
          ${sheetTableHtml(r.cols || [], r.rows || [], { theme: forms.find((f) => f.id === r.formId)?.theme || 'blue' })}`,
        actions: [{ label: 'Close', onClick: (x) => x.close() }]
      });
      return;
    }
    openModal({
      title: r.formTitle, wide: true,
      html: `<div class="hero">${ring(r.score)}<div><span class="pill green">${r.counts?.ok ?? 0} meet</span> <span class="pill red">${r.counts?.nok ?? 0} do not meet</span> <span class="pill grey">${r.counts?.na ?? 0} not applicable</span></div></div><p class="hint">${esc(when(r))} · ${esc(r.department)}${r.deptOther ? ' (other)' : ''} · ${esc(r.line)}${r.lineOther ? ' (other)' : ''} · audited by ${esc(r.auditorName)}${r.auditorEmployeeId ? ' (' + esc(r.auditorEmployeeId) + ')' : ''}</p>
        <p><span class="pill green">${r.counts?.ok ?? 0} meet</span> <span class="pill red">${r.counts?.nok ?? 0} do not meet</span> <span class="pill grey">${r.counts?.na ?? 0} not applicable</span> ${r.score != null ? `<b style="margin-left:8px">Score ${r.score}%</b>` : ''}</p>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Audit point</th><th>Criteria</th><th>Observation</th><th>Remark</th></tr></thead><tbody>
        ${(r.answers || []).map((a, i) => `<tr><td data-label="#">${i + 1}</td><td data-label="Audit point"><b>${esc(a.point)}</b></td><td data-label="Criteria">${esc(a.criteria)}</td><td data-label="Observation"><span class="pill ${RESULT[a.result]?.[1] || ''}">${esc(RESULT[a.result]?.[0] || a.result)}</span></td><td data-label="Remark">${esc(a.remark || '')}</td></tr>`).join('')}</tbody></table></div>`,
      actions: [{ label: 'Close', onClick: (x) => x.close() }]
    });
  }

  /* ---------- fill a form ---------- */
  function showSheet(f) {
    root.innerHTML = '<div style="max-width:1200px;margin:0 auto"><a href="#" id="back" style="font-size:14px">← All audit forms</a><div id="sheetHost"></div></div>';
    root.querySelector('#back').onclick = (e) => { e.preventDefault(); location.hash = ''; };
    renderSheet(root.querySelector('#sheetHost'), f, { places, ctx: { ...ctx, area: scopeLabel(ctx.profile || {}) }, onSubmit: async (d) => {
      await submitAudit({ formId: f.id, formTitle: f.title, ...d, ...(f.auto?.area ? { auditorArea: scopeLabel(ctx.profile || {}) } : {}), auditorName: ctx.name, auditorEmployeeId: ctx.employeeId || '', dateKey: dayKeyOf(new Date()) });
      done(f, d.counts, d.score, true);
    } });
  }

  function showForm(f) {
    if (f.kind === 'sheet') return showSheet(f);
    const deptList = [...places.keys()].sort();
    const O = '__other__';
    root.innerHTML = `<div class="gf"><a href="#" id="back" style="font-size:14px">← All audit forms</a>
      <div class="gc head"><h1>${esc(f.title)}</h1><div style="white-space:pre-wrap;color:var(--ink2)">${esc(f.description || '')}</div><p class="hint" style="margin:10px 0 0">Audited by ${esc(ctx.name)}. <span style="color:#dc2626">*</span> Required</p></div>
      <div class="gc" data-q="dept"><div class="q">Department <i>*</i></div>
        <select id="a_dept"><option value="">Choose</option>${deptList.map((d) => `<option>${esc(d)}</option>`).join('')}<option value="${O}">Other (type below)</option></select>
        <input id="a_dept_o" placeholder="Type the department" maxlength="80" style="margin-top:8px" hidden><div class="err2" hidden></div></div>
      <div class="gc" data-q="line"><div class="q">Line <i>*</i></div>
        <select id="a_line"><option value="">Choose the department first</option></select>
        <input id="a_line_o" placeholder="Type the line or area" maxlength="80" style="margin-top:8px" hidden><div class="err2" hidden></div></div>
      ${(f.points || []).map((p, i) => `<div class="gc" data-q="p${i}"><div class="q">${i + 1}. ${esc(p.point)} <i>*</i></div>
        <div class="crit"><small>Criteria</small>${esc(p.criteria)}</div>
        <div class="opts" role="radiogroup" aria-label="Observation for point ${i + 1}">
          ${['ok', 'nok', 'na'].map((k) => `<label class="opt"><input type="radio" name="r${i}" value="${k}"><span class="${k}">${RESULT[k][0]}</span></label>`).join('')}</div>
        <label class="l" for="rm${i}">Remark / note <span class="rq" id="rq${i}"></span></label><textarea id="rm${i}" rows="2" maxlength="500" placeholder="What did you observe?"></textarea><div class="err2" hidden></div></div>`).join('')}
      <div class="gc bar"><span class="hint" id="prog"></span><span><button type="button" class="btn btn-ghost" id="clr">Clear form</button> <button type="button" class="btn btn-primary" id="sub">Submit</button></span></div></div>`;
    const $ = (id) => root.querySelector('#' + id);
    root.querySelector('#back').onclick = (e) => { e.preventDefault(); location.hash = ''; };
    const deptV = () => $('a_dept').value;
    const fillLines = () => {
      const d = deptV(), ln = $('a_line'), lo = $('a_line_o');
      $('a_dept_o').hidden = d !== O;
      if (d === O) { ln.innerHTML = `<option value="${O}">Other (type below)</option>`; ln.value = O; ln.disabled = true; lo.hidden = false; return; }
      ln.disabled = false;
      const lines = d ? [...(places.get(d) || [])].sort() : [];
      ln.innerHTML = `<option value="">${d ? 'Choose' : 'Choose the department first'}</option>${lines.map((l) => `<option>${esc(l)}</option>`).join('')}${d ? `<option value="${O}">Other (type below)</option>` : ''}`;
      lo.hidden = true;
    };
    $('a_dept').onchange = fillLines;
    $('a_line').onchange = () => { $('a_line_o').hidden = $('a_line').value !== O; };
    const pts = f.points || [];
    const prog = () => { const n = pts.filter((_, i) => root.querySelector(`input[name="r${i}"]:checked`)).length; $('prog').textContent = `${n} of ${pts.length} audit points answered`; };
    pts.forEach((_, i) => {
      root.querySelectorAll(`input[name="r${i}"]`).forEach((r) => { r.onchange = () => { $('rq' + i).innerHTML = r.value === 'nok' ? '<b style="color:#dc2626">(required)</b>' : ''; root.querySelector(`[data-q="p${i}"]`).classList.remove('bad'); prog(); }; });
    });
    prog();
    $('clr').onclick = () => { if (confirm('Clear everything you entered?')) showForm(f); };
    const flag = (q, msg) => { const c = root.querySelector(`[data-q="${q}"]`); c.classList.add('bad'); const e = c.querySelector('.err2'); e.textContent = msg; e.hidden = false; return c; };
    $('sub').onclick = async (ev) => {
      root.querySelectorAll('.gc.bad').forEach((c) => { c.classList.remove('bad'); c.querySelector('.err2').hidden = true; });
      let first = null; const bad = (q, m) => { const c = flag(q, m); first = first || c; };
      const dOther = deptV() === O, lOther = $('a_line').value === O;
      const department = dOther ? clean($('a_dept_o').value) : deptV(), line = lOther ? clean($('a_line_o').value) : $('a_line').value;
      if (!department) bad('dept', dOther ? 'Type the department.' : 'Choose the department.');
      if (!line) bad('line', lOther ? 'Type the line or area.' : 'Choose the line.');
      const answers = pts.map((p, i) => {
        const r = root.querySelector(`input[name="r${i}"]:checked`)?.value || '', remark = clean($('rm' + i).value);
        if (!r) bad('p' + i, 'Select an observation.'); else if (r === 'nok' && !remark) bad('p' + i, 'Write a remark: this point does not meet the criteria.');
        return { id: p.id || String(i), point: p.point, criteria: p.criteria, result: r, remark };
      });
      if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('Please complete the highlighted questions.'); return; }
      const counts = { total: answers.length, ok: answers.filter((a) => a.result === 'ok').length, nok: answers.filter((a) => a.result === 'nok').length, na: answers.filter((a) => a.result === 'na').length };
      const scored = counts.ok + counts.nok, score = scored ? Math.round((counts.ok / scored) * 1000) / 10 : null;
      ev.currentTarget.disabled = true;
      try {
        await submitAudit({ formId: f.id, formTitle: f.title, department, deptOther: dOther, line, lineOther: lOther, answers, counts, score,
          auditorName: ctx.name, auditorEmployeeId: ctx.employeeId || '', dateKey: dayKeyOf(new Date()) });
        done(f, counts, score);
      } catch (e) { toast(friendlyError(e)); ev.currentTarget.disabled = false; }
    };
  }

  function done(f, counts, score, sheet) {
    window.scrollTo({ top: 0 });
    root.innerHTML = `<div class="gf"><div class="gc head"><h1>Response recorded</h1><p>Your response to <b>${esc(f.title)}</b> has been saved.</p>
      <div class="big">${score != null ? score + '%' : '-'}</div><p><span class="pill green">${counts.ok} ${sheet ? 'OK' : 'meet'}</span> <span class="pill red">${counts.nok} ${sheet ? 'NOT OK' : 'do not meet'}</span>${sheet ? '' : ` <span class="pill grey">${counts.na} not applicable</span>`}</p>
      <p style="margin-top:14px"><button type="button" class="btn btn-primary" id="again">Submit another response</button> <button type="button" class="btn btn-ghost" id="home">Back to all forms</button></p></div></div>`;
    root.querySelector('#again').onclick = () => showForm(f);
    root.querySelector('#home').onclick = () => { location.hash = ''; showList(); };
  }

  /* ---------- routing ---------- */
  function route() {
    const m = location.hash.match(/^#form=(.+)$/), f = m && forms.find((x) => x.id === decodeURIComponent(m[1]));
    if (f) { window.scrollTo({ top: 0 }); showForm(f); } else showList();
  }
  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
