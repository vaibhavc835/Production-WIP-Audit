<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Production WIP Audit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 22px;
      color: #0f172a;
      font-weight: 700;
    }

    .logo p {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #errorMsg {
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }

    #loading {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <h1>Production WIP Audit</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>

    <button id="loginBtn">Login</button>

    <div id="errorMsg"></div>
    <div id="loading">Please wait...</div>
  </div>

  <script type="module">
    import { loginUser, checkAuth, getUserProfile } from './js/firebase-config.js';

    // If already logged in → go to home
    checkAuth(async (user) => {
      if (user) {
        window.location.href = "home.html";
      }
    });

    const loginBtn = document.getElementById("loginBtn");
    const errorMsg = document.getElementById("errorMsg");
    const loading = document.getElementById("loading");

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showError("Please enter email and password");
        return;
      }

      loginBtn.disabled = true;
      loading.style.display = "block";
      errorMsg.style.display = "none";

      const result = await loginUser(email, password);

      loading.style.display = "none";
      loginBtn.disabled = false;

      if (result.success) {
        window.location.href = "home.html";
      } else {
        showError("Wrong email or password");
      }
    });

    // Allow Enter key to login
    document.getElementById("password").addEventListener("keypress", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.style.display = "block";
    }
  </script>
</body>
</html>
