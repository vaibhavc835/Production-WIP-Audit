<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Issue Report | Production WIP Audit</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="modulepreload" href="js/wip-core.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <style>
    html,body{margin:0;background:#0b1220}
    #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0b1220,#12304f);color:#cbd5e1;font:15px 'Segoe UI',system-ui,sans-serif}
    #boot i{display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#4ade80;animation:bootspin .8s linear infinite}
    #boot p{margin-top:10px;max-width:300px;font-size:13.5px;color:#94a3b8}
    @keyframes bootspin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
  </style>
</head>
<body>
<div id="boot" role="status"><div><i></i>Loading Production WIP Audit…</div></div>
<script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b) b.firstElementChild.insertAdjacentHTML('beforeend', '<p>This is taking longer than usual. Check your internet connection, then reload the page.</p>');
  }, 12000);
</script>
<script type="module">
  import {
    startPage, icon, esc, toast, openModal, confirmBox, friendlyError,
    listUsers, listColl, listIssueStations, getIssueSetup, listIssues, listIssuesAtStation, createIssue, submitContainment, returnIssue, approveIssue, signoffIssue, updateIssue,
    buildRoute, getMaster, masterLines, repeatInfo, lvOf, issueRole, currentLevel, issueMs, issueNo, repeatKey, fmtDur, levelLabel, dayKeyOf, weekMonthOf, DEFAULT_LEAD
  } from './js/wip-core.js';

  const ctx = await startPage({ active: 'issue', title: 'Issue Report' });
  const main = ctx.main;
  const me = { uid: ctx.uid, name: ctx.name, employeeId: ctx.employeeId, level: lvOf(ctx.profile.level) };

  const st = document.createElement('style');
  st.textContent = `
  .iss [hidden]{display:none!important}
  .iss .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
  .iss .tabs button{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
  .iss .tabs button:hover{background:#f1f5f9}
  .iss .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .iss .tabs b{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:11.5px;line-height:18px;text-align:center}
  .iss .sec{margin:18px 0 8px;font-size:15px;color:var(--ink2)}
  .iss .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
  .iss .ic{background:#fff;border:1px solid var(--line);border-left:5px solid #94a3b8;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
  .iss .ic:hover{box-shadow:0 2px 10px rgba(15,23,42,.08)}
  .iss .ic.act{border-left-color:#2563eb}.iss .ic.late{border-left-color:#dc2626}.iss .ic.appr{border-left-color:#d97706}.iss .ic.esc{border-left-color:#7c3aed}
  .iss .ic .itop{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
  .iss .ic .itop b{color:var(--ink)}
  .iss .ic .where{font-weight:700;font-size:14.5px}
  .iss .ic .desc{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .iss .ic .ifoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
  .iss .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f1f5f9;color:#334155;white-space:nowrap}
  .iss .pill.red{background:#fee2e2;color:#991b1b}.iss .pill.green{background:#dcfce7;color:#166534}.iss .pill.amber{background:#fef3c7;color:#92400e}.iss .pill.blue{background:#dbeafe;color:#1e40af}.iss .pill.violet{background:#ede9fe;color:#5b21b6}
  .iss .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
  .iss .filters select,.iss .filters input{width:auto;min-width:140px}
  .iss .formcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;max-width:900px}
  .iss .formcard h2{font-size:18px;margin:0 0 4px}
  .iss .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
  .iss .kv dt{color:var(--muted)}.iss .kv dd{margin:0;word-break:break-word}
  .iss .route{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
  .iss .route .warn{color:#b45309;font-weight:600}
  .rep{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}.rep.bad{background:#fee2e2;color:#7f1d1d}.rep.ok{background:#dcfce7;color:#14532d}
  .est{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}.est b{font-size:15px}
  .iss .psmrow td small{color:var(--muted)}
  .iss .idet{display:flex;flex-direction:column;gap:12px}
  .iss .ihead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .iss .ino{font-weight:700;color:var(--muted);font-size:13px}.iss .iwhere{font-size:19px;font-weight:700;margin:4px 0 8px}
  .iss .spill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:#e2e8f0}
  .iss .spill.open{background:#dbeafe;color:#1e40af}.iss .spill.late{background:#fee2e2;color:#991b1b}.iss .spill.wait{background:#fef3c7;color:#92400e}.iss .spill.done{background:#dcfce7;color:#166534}
  .iss .chips{display:flex;gap:6px;flex-wrap:wrap}.iss .chip{padding:2px 10px;border-radius:8px;background:#f1f5f9;font-size:12.5px;color:#334155}.iss .chip.bad{background:#fee2e2;color:#991b1b;font-weight:700}
  .iss .iwhen{text-align:right}.iss .iwhen small{display:block;color:var(--muted)}.iss .iwhen b{font-size:15px}
  .iss .flow{list-style:none;margin:0;padding:12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
  .iss .flow .st{display:flex;gap:10px;align-items:flex-start;position:relative}.iss .flow .st+.st::before{content:'';position:absolute;left:-14px;top:13px;width:12px;height:2px;background:#cbd5e1}
  .iss .flow .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:#e2e8f0;color:#64748b}
  .iss .flow .st.done .dot{background:#16a34a;color:#fff}.iss .flow .st.now .dot{background:#2563eb;color:#fff;box-shadow:0 0 0 4px #dbeafe}
  .iss .flow b{display:block;font-size:13.5px}.iss .flow span,.iss .flow small,.iss .flow em{display:block;font-size:12.5px;color:#475569;font-style:normal}.iss .flow small{color:var(--muted)}.iss .flow .st.todo{opacity:.55}
  .iss .icard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}.iss .icard.act{border-left:5px solid #2563eb}
  .iss .icard h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}.iss .icard .big{font-size:15.5px;white-space:pre-wrap;word-break:break-word;margin-bottom:6px}
  .iss .kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin:0}.iss .kg dt{font-size:12px;color:var(--muted)}.iss .kg dd{margin:0;font-size:14px;word-break:break-word}
  .iss .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:8px}.iss .tl{border-radius:10px;padding:8px 12px;background:#f1f5f9}.iss .tl small{display:block;font-size:12px;color:var(--muted)}.iss .tl b{font-size:18px}
  .iss .tl.bad{background:#fee2e2}.iss .tl.good{background:#dcfce7}
  @media (max-width:760px){.iss .flow{grid-template-columns:1fr 1fr}.iss .flow .st+.st::before{display:none}.iss .iwhen{text-align:left}}
  @media (max-width:640px){.iss .kv{grid-template-columns:1fr}.iss .kv dt{margin-top:6px}}
  `;
  document.head.appendChild(st);

  /* ---------- data ---------- */
  const D = { setup: null, users: [], resps: [], leads: [], stations: [], issues: [] };
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDT = (ms) => { if (!ms) return '-'; const d = new Date(ms); return `${String(d.getDate()).padStart(2, '0')}-${MON[d.getMonth()]}-${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const tsMs = (t) => t?.toMillis?.() ?? (typeof t === 'number' ? t : 0);
  const uName = (uid) => D.users.find((u) => u.uid === uid)?.name || '';
  const clean = (v) => String(v ?? '').trim();
  const lc = (v) => clean(v).toLowerCase();

  async function loadAll() {
    const [setup, users, resps, leads, stations, issues, mst] = await Promise.all([getIssueSetup(), listUsers(), listColl('issueResp'), listColl('issueLead'), listIssueStations(), listIssues(), getMaster().catch(() => null)]);
    Object.assign(D, { setup, users: users.map((u) => ({ ...u, level: lvOf(u.level) })), resps, leads, stations, issues }); MST = mst && mst.stations ? mst : null;
  }
  let MST = null;
  async function reloadIssues() { D.issues = await listIssues(); }

  main.innerHTML = `<div class="iss"><div class="page-head"><div><h1>Issue Report</h1><p class="sub">Raise a production issue, add containment actions and approve them.</p></div></div>
    <div class="tabs" id="tabs"></div><div id="view"><div class="empty">Loading…</div></div></div>`;
  const tabsEl = main.querySelector('#tabs'), view = main.querySelector('#view');
  try { await loadAll(); } catch (e) { view.innerHTML = `<div class="empty"><b>Could not load issues.</b><p>${esc(friendlyError(e))}</p></div>`; throw e; }

  /* ---------- helpers ---------- */
  const stageFields = (stage) => Object.entries(D.setup.fields).filter(([, f]) => f.stage === stage).map(([k, f]) => ({ key: k, ...f }));
  const LABELS = Object.fromEntries(Object.entries(D.setup.fields).map(([k, f]) => [k, f.label]));
  const NUMS = new Set(['mp', 'mc', 'downtimeH']);

  function statusPill(i, now = Date.now()) {
    if (i.status === 'closed') return i.psmRefer ? '<span class="pill violet">Closed, refer to PSM</span>' : '<span class="pill green">Closed</span>';
    if (i.status === 'pending') return '<span class="pill amber">Waiting for approval</span>';
    const r = issueRole(i, '', now);
    return r.overdue ? '<span class="pill red">Open, overdue</span>' : '<span class="pill blue">Open</span>';
  }
  function timeText(i, now = Date.now()) {
    const L = i.lead || DEFAULT_LEAD, mins = (now - issueMs(i)) / 60000;
    if (i.status !== 'open') return '';
    const left = (L.target ?? 450) - mins;
    return left >= 0 ? `${fmtDur(left)} left` : `Overdue by ${fmtDur(left)}`;
  }

  /* ---------- live repeat count and running loss ---------- */
  const RPT = () => D.setup.psm?.windowDays || 90;
  const repeatOf = (i, list = D.issues) => repeatInfo(i, list, RPT());
  const repeatHtml = (n) => n.repeated
    ? `<div class="rep bad"><b>Repeated issue.</b> This is occurrence ${n.total} at this station and category: ${n.others} other in the last ${esc(n.windowDays)} days${n.loss ? `, ${esc(n.loss)} hours lost earlier` : ''}${n.last ? `, last on ${esc(fmtDT(n.last))}` : ''}.</div>`
    : `<div class="rep ok"><b>First time</b> at this station and category in the last ${esc(n.windowDays)} days.</div>`;
  const runLoss = (i, mp, mc, now = Date.now()) => {
    const h = Math.max(0, (now - issueMs(i)) / 3600000), hrs = (Number(mp) || 0) * ((Number(mc) || 0) > 0 ? Number(mc) : 1) * h;
    return { dt: h, hours: Math.round(hrs * 100) / 100, cost: Math.round(hrs * (Number(D.setup.rate) || 0)) };
  };
  const inr = (n) => Number(n || 0).toLocaleString('en-IN');

  /* ---------- tab: my tasks ---------- */
  function card(i, role, now) {
    const cls = role.role === 'approve' ? 'appr' : role.overdue ? 'late' : role.role === 'action' ? 'act' : role.role === 'escalated' ? 'esc' : '';
    const tag = { action: 'Action needed', cosign: 'Optional approval', signed: 'You signed off', info: 'For information', escalated: `Escalated to you (${levelLabel(role.level)})`, approve: 'Approve containment', waiting: 'Waiting for approval', mine: 'Raised by you' }[role.role];
    const t = timeText(i, now);
    return `<button type="button" class="ic ${cls}" data-id="${esc(i.id)}"><div class="itop"><b>${esc(issueNo(i))}</b><span>${esc(fmtDT(issueMs(i)))}</span></div>
      <div class="where">${esc(i.station || '-')} <span style="font-weight:500;color:var(--muted)">· ${esc(i.line || '')}</span></div>
      <div class="desc">${esc(i.description || '')}</div>
      <div class="ifoot">${['action', 'approve', 'cosign', 'escalated', 'info'].includes(role.role) && repeatOf(i).repeated ? `<span class="pill red">Repeated ×${repeatOf(i).total}</span>` : ''}<span class="pill">${esc(i.category || '')}</span><span class="pill">${esc(i.respDept || '')}</span><span class="pill ${role.role === 'approve' ? 'amber' : role.role === 'escalated' ? 'violet' : 'blue'}">${esc(tag)}</span>${t ? `<span class="pill ${t.startsWith('Overdue') ? 'red' : 'green'}">${esc(t)}</span>` : ''}</div></button>`;
  }
  function myBuckets() {
    const now = Date.now(), b = { action: [], approve: [], cosign: [], escalated: [], info: [], waiting: [], mine: [] };
    D.issues.filter((i) => i.status === 'open' || i.status === 'pending').forEach((i) => { const r = issueRole(i, me.uid, now); if (r.role) b[r.role].push([i, r]); });
    Object.values(b).forEach((a) => a.sort((x, y) => issueMs(x[0]) - issueMs(y[0])));
    return b;
  }
  function drawTasks() {
    const b = myBuckets(), now = Date.now();
    const sec = (title, arr, hint) => arr.length ? `<h3 class="sec">${title} <span class="path" style="font-weight:400;color:var(--muted)">(${arr.length})</span></h3>${hint ? `<p class="hint">${hint}</p>` : ''}<div class="cards">${arr.map(([i, r]) => card(i, r, now)).join('')}</div>` : '';
    const html = sec('Action needed: add containment', b.action) + sec('For your approval', b.approve) + sec('Optional approval', b.cosign, 'Not mandatory. The initiator closes the issue. You may sign off or return it.') + sec('Escalated to you', b.escalated, 'These were not solved in the lead time and have reached your level.') + sec('For your information', b.info, 'Your team members have these open.') + sec('Waiting for approval', b.waiting) + sec('Raised by you', b.mine);
    view.innerHTML = html || '<div class="empty"><b>Nothing waiting for you.</b><p>Use “Raise issue” to report a new issue.</p></div>';
    view.querySelectorAll('.ic').forEach((el) => { el.onclick = () => openIssue(D.issues.find((i) => i.id === el.dataset.id)); });
  }

  /* ---------- tab: raise issue ---------- */
  function drawRaise() {
    const F = D.setup.fields, S = D.setup;
    const fs = stageFields('initiator');
    const has = (k) => fs.some((f) => f.key === k);
    const mark = (k) => F[k].required ? ' *' : '';
    const sel = (id, k, opts, ph = 'Select…') => `<div><label class="l" for="${id}">${esc(F[k].label)}${mark(k)}</label><select id="${id}"><option value="">${ph}</option>${opts.map((o) => `<option>${esc(o)}</option>`).join('')}</select></div>`;
    const field = (f) => {
      const k = f.key;
      if (k === 'area') return sel('f_area', k, S.areas);
      if (k === 'line') return sel('f_line', k, [], 'Select area first');
      if (k === 'station') return sel('f_station', k, [], 'Select line first');
      if (k === 'nature') return sel('f_nature', k, S.natures);
      if (k === 'category') return sel('f_category', k, S.categories);
      if (k === 'respDept') return sel('f_respDept', k, S.respDepts) + `<div><label class="l" for="f_respLine">Responsibility (line, optional)</label><select id="f_respLine"><option value="">All lines</option></select></div>`;
      if (k === 'description') return `<div class="full"><label class="l" for="f_description">${esc(F[k].label)}${mark(k)}</label><textarea id="f_description" rows="3" maxlength="600"></textarea></div>`;
      if (NUMS.has(k)) return `<div><label class="l" for="f_${k}">${esc(F[k].label)}${mark(k)}</label><input id="f_${k}" type="number" min="0" step="any"></div>`;
      return `<div><label class="l" for="f_${k}">${esc(F[k].label)}${mark(k)}</label><input id="f_${k}" maxlength="120"></div>`;
    };
    view.innerHTML = `<div class="formcard"><h2>Raise a new issue</h2><p class="hint" style="margin-bottom:12px">Fields marked * are required. The issue appears at the top of the responsible user's Home page and their manager's.</p>
      <form class="fg" id="rf" autocomplete="off">${fs.map(field).join('')}</form>
      <div class="route" id="route"><span class="hint">Choose the responsible department and category to see who will get this issue.</span></div>
      <div class="err" id="rerr"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn btn-primary" id="rsub">Submit issue</button></div></div>`;
    const $ = (id) => view.querySelector('#' + id);
    const val = (k) => clean($('f_' + k)?.value);
    const fill = (id, opts, ph) => { const s = $(id); if (!s) return; const cur = s.value; s.innerHTML = `<option value="">${ph}</option>` + opts.map((o) => `<option>${esc(o)}</option>`).join(''); if (opts.includes(cur)) s.value = cur; };
    const areaSt = () => D.stations.filter((s) => s.area === val('area'));
    const refreshLine = () => { if (!has('line')) return; fill('f_line', [...new Set(areaSt().map((s) => s.line))].sort(), val('area') ? 'Select line' : 'Select area first'); refreshStation(); };
    const refreshStation = () => { if (!has('station')) return; fill('f_station', areaSt().filter((s) => s.line === val('line')).map((s) => s.station).sort(), val('line') ? 'Select station' : 'Select line first'); };
    const optText = (route) => {
      const o = route.optTiers || {}, a = D.setup.approval;
      const bits = [o.l2 && `your manager ${esc(uName(o.l2))}`, o.l3 && `HOD ${esc(uName(o.l3))} (downtime over ${esc(a.hodHours)} h)`, o.l4 && `GM ${esc(uName(o.l4))} (over ${esc(a.gmHours)} h)`].filter(Boolean);
      return bits.length ? ` Optional sign-off: ${bits.join(', ')}.` : '';
    };
    const showRoute = () => {
      const r = $('route'), dep = val('respDept'), cat = val('category'), rl = clean($('f_respLine')?.value);
      if (!dep || !cat) { r.innerHTML = '<span class="hint">Choose the responsible department and category to see who will get this issue.</span>'; return null; }
      const route = buildRoute({ users: D.users, resps: D.resps, leads: D.leads, respDept: dep, respLine: rl, category: cat, initiatorUid: me.uid, chosenUid: view.querySelector('#f_pickUser')?.value || '' });
      const names = (a) => a.map(uName).filter(Boolean).join(', ');
      const esc2 = ['l2', 'l3', 'l4', 'l5'].map((k, n) => route.tiers[k] ? `${levelLabel(n + 2)}: <b>${esc(uName(route.tiers[k]))}</b>` : '').filter(Boolean);
      const pickSel = route.canPick ? `<div style="margin:6px 0"><label class="l" for="f_pickUser">Responsible user *</label><select id="f_pickUser">${route.pickUids.map((u) => `<option value="${esc(u)}" ${u === route.primaryUid ? 'selected' : ''}>${esc(uName(u))}</option>`).join('')}</select></div>` : '';
      const apName = route.approverUid && route.approverUid !== me.uid ? uName(route.approverUid) : '';
      r.innerHTML = route.responsibleUids.length
        ? `${pickSel}<div>Responsible: <b>${esc(route.canPick ? uName(route.primaryUid) : names(route.responsibleUids))}</b>. Target ${esc(fmtDur(route.lead.target))} to add a containment action.</div>
           <div class="hint">${esc2.join(' · ') || 'No managers set above the responsible user.'}</div>
           <div class="hint">Approval by ${apName ? `<b>${esc(apName)}</b> (your superior)` : '<b>you</b> (the initiator)'}.${optText(route)}</div>`
        : '<div class="warn">No user is assigned to this department yet. Ask an administrator to set \'Works at\' for users in User Control, or add one in Issue Setup, Responsibility.</div>';
      return route;
    };
    ['area', 'line'].forEach((k) => { $('f_' + k)?.addEventListener('change', k === 'area' ? refreshLine : refreshStation); });
    const respLines = (dep) => { try { return MST ? masterLines(MST, dep) : []; } catch { return []; } };
    $('f_respDept')?.addEventListener('change', () => { fill('f_respLine', respLines(val('respDept')).sort(), 'All lines'); showRoute(); });
    $('f_respLine')?.addEventListener('change', showRoute);
    $('f_category')?.addEventListener('change', showRoute);
    $('route').addEventListener('change', (e) => { if (e.target.id === 'f_pickUser') { const keep = e.target.value; showRoute(); const el = $('f_pickUser'); if (el) el.value = keep; } });
    $('rsub').onclick = async (ev) => {
      const btn = ev.currentTarget, err = $('rerr'); err.textContent = '';
      const d = {};
      for (const f of fs) {
        const v = val(f.key);
        if (f.required && !v) { err.textContent = `${f.label} is required.`; $('f_' + f.key)?.focus(); return; }
        d[f.key] = NUMS.has(f.key) ? (v === '' ? 0 : Number(v)) : v;
      }
      d.respLine = clean($('f_respLine')?.value);
      const route = showRoute();
      if (!route || !route.responsibleUids.length) { err.textContent = 'No responsible user is set for this department and category. An administrator must add one in Issue Setup.'; return; }
      btn.disabled = true;
      try {
        const now = new Date();
        let repeat = 'New';
        if (d.station) { const same = await listIssuesAtStation(d.station); const key = repeatKey(d); if (same.some((x) => repeatKey(x) === key)) repeat = 'Repeated'; }
        const rec = {
          ...d, status: 'open', repeat,
          initiatorUid: me.uid, reportedByName: me.name, initiatorEmployeeId: me.employeeId,
          responsibleUids: route.responsibleUids, primaryUid: route.primaryUid, responsibleName: uName(route.primaryUid),
          tiers: route.tiers, lead: route.lead, approverUid: route.approverUid || me.uid, optTiers: route.optTiers,
          reportedMs: now.getTime(), dateKey: dayKeyOf(now), weekMonth: weekMonthOf(now)
        };
        const out = await createIssue(rec);
        toast(`Issue ISS-${String(out.sn).padStart(4, '0')} raised.`);
        await reloadIssues(); show('tasks');
      } catch (e) { err.textContent = friendlyError(e); btn.disabled = false; }
    };
    refreshLine();
  }

  /* ---------- issue details and actions ---------- */
  function openIssue(i) {
    if (!i) return;
    const now = Date.now(), r = issueRole(i, me.uid, now);
    const canAct = i.status === 'open' && (r.role === 'action' || ctx.isAdmin);
    const canApprove = i.status === 'pending' && (r.role === 'approve' || ctx.isAdmin), canCosign = i.status === 'pending' && r.role === 'cosign';
    const row = (k, v) => (v === undefined || v === null || v === '' ? '' : `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`);
    const L = (k) => LABELS[k] || k;
    const route = [['Level 2', i.tiers?.l2], ['Level 3', i.tiers?.l3], ['Level 4', i.tiers?.l4], ['Level 5', i.tiers?.l5]].filter(([, u]) => u).map(([l, u]) => `${l}: ${uName(u) || '?'}`).join(' · ');
    const seeRep = ['action', 'approve', 'cosign', 'escalated', 'info'].includes(r.role) || ctx.isAdmin;
    const live = i.status === 'open' && (r.role === 'action' || ctx.isAdmin) ? runLoss(i, i.mp, i.mc) : null;
    const T = i.tiers || {}, lead = i.lead || {};
    const stCls = i.status === 'open' ? (r.overdue ? 'late' : 'open') : i.status === 'pending' ? 'wait' : 'done';
    const stTxt = i.status === 'open' ? (r.overdue ? 'Open · overdue' : 'Open') : i.status === 'pending' ? 'Waiting for approval' : 'Closed';
    const cAt = tsMs(i.containmentAt), aAt = tsMs(i.approvedAt) || i.approvedMs || 0;
    const dly = i.delayMin != null ? `${fmtDur(i.delayMin)}${i.leadResult ? ' · ' + i.leadResult : ''}` : '';
    const step = (n, label, state, who, when, note) => `<li class="st ${state}"><span class="dot">${state === 'done' ? '✓' : n}</span><div><b>${label}</b>${who ? `<span>${esc(who)}</span>` : ''}${when ? `<small>${esc(when)}</small>` : ''}${note ? `<em>${esc(note)}</em>` : ''}</div></li>`;
    const raised = step(1, 'Issue raised', 'done', i.reportedByName, fmtDT(issueMs(i)), '');
    const contained = step(2, 'Containment action', i.status === 'open' ? 'now' : 'done', i.status === 'open' ? (i.responsibleName || (i.responsibleUids || []).map(uName).join(', ')) : i.containmentBy?.name, i.status === 'open' ? (lead.target ? `Target ${fmtDur(lead.target)} · ${fmtDur(r.mins)} elapsed` : '') : fmtDT(cAt), i.status === 'open' ? '' : dly);
    const approval = step(3, 'Approval', i.status === 'pending' ? 'now' : i.status === 'closed' ? 'done' : 'todo', uName(i.approverUid) || i.reportedByName, i.status === 'closed' ? fmtDT(aAt) : '', i.status === 'closed' ? (i.approvalNote || '') : (i.returnCount ? `Returned ${i.returnCount}×` : ''));
    const closed = step(4, 'Closed', i.status === 'closed' ? 'done' : 'todo', i.status === 'closed' ? i.approvedBy?.name : '', '', '');
    const chip = (t) => (t ? `<span class="chip">${esc(t)}</span>` : '');
    const kv = (rows) => { const h = rows.filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join(''); return h ? `<dl class="kg">${h}</dl>` : ''; };
    const tile = (l, v, tone) => `<div class="tl ${tone || ''}"><small>${esc(l)}</small><b>${esc(v)}</b></div>`;
    const showImpact = i.status !== 'open' && (i.downtimeH != null || i.hoursTotal || i.mhCost || i.lossCorrectedH != null);
    const body = `<div class="idet">${seeRep ? `<div id="repbox">${repeatHtml(repeatOf(i))}</div>` : ''}${live ? `<div class="est" id="liveBox">Downtime so far: <b>${esc(fmtDur(live.dt * 60))}</b> since the issue was reported (${esc(fmtDT(issueMs(i)))}).</div>` : ''}
      <div class="ihead"><div><span class="spill ${stCls}">${stTxt}</span> <span class="ino">${esc(issueNo(i))}</span><div class="iwhere">${esc([i.area, i.line, i.station].filter(Boolean).join(' › '))}</div>
        <div class="chips">${chip(i.category)}${chip(i.nature)}${chip(i.respDept && 'Responsibility: ' + i.respDept)}${i.respLine ? chip(i.respLine) : ''}${chip(i.model)}${chip(i.partNumber)}${i.repeat === 'Repeated' ? '<span class="chip bad">Repeated</span>' : ''}${i.psmRefer ? '<span class="chip bad">PSM</span>' : ''}</div></div>
        <div class="iwhen"><small>Reported</small><b>${esc(fmtDT(issueMs(i)))}</b><small>${esc(i.weekMonth || '')}</small></div></div>
      <ol class="flow">${raised}${contained}${approval}${closed}</ol>
      <div class="icard"><h4>Problem</h4><div class="big">${esc(i.description || '-')}</div>${kv([['Reported by', i.reportedByName]])}</div>
      <div class="icard"><h4>Responsibility</h4>${kv([[L('respDept'), i.respDept], ['Responsible', i.responsibleName || (i.responsibleUids || []).map(uName).join(', ')], ['Approver (initiator)', uName(i.approverUid) || i.reportedByName], ['Escalation path', route], ['Optional sign-off by', (i.optApprovalUids || []).map(uName).join(', ')], ['Signed off', (i.signoffs || []).map((x) => `${x.name}${x.note ? ': ' + x.note : ''}`).join('; ')]])}</div>
      ${i.status !== 'open' || i.containment ? `<div class="icard act"><h4>${esc(L('containment'))}</h4><div class="big">${esc(i.containment || '-')}</div>${kv([['Done by', i.containmentBy?.name], ['Time', cAt ? fmtDT(cAt) : ''], ['Delay against target', dly], ['Escalation level', i.status === 'open' ? '' : i.escalationLevel], ['Total MP', i.mp || ''], ['No. of M-C', i.mc || '']])}</div>` : ''}
      ${showImpact ? `<div class="icard"><h4>Impact</h4><div class="tiles">${i.downtimeH != null ? tile('Downtime (system)', i.downtimeH + ' h', 'bad') : ''}${i.hoursTotal ? tile('Hours lost (system)', i.hoursTotal + ' h') : ''}${i.mhCost ? tile('Cost (system)', '₹ ' + Number(i.mhCost).toLocaleString('en-IN')) : ''}${i.lossCorrectedH != null ? tile('Corrected loss', i.lossCorrectedH + ' h' + (i.lossCorrectedCost != null ? ' · ₹ ' + inr(i.lossCorrectedCost) : ''), 'good') : ''}</div>
        ${i.lossCorrectedH != null ? kv([['Corrected loss (hours)', `${i.lossCorrectedH} h, cost ${inr(i.lossCorrectedCost)}, by ${i.lossCorrectedBy || ''}`], ['Reason for correction', i.lossCorrectedReason]]) : ''}</div>` : ''}
      ${i.returnCount || i.status === 'closed' || i.psmRefer ? `<div class="icard"><h4>Approval</h4>${kv([['Returned', i.returnCount ? `${i.returnCount} time(s). Last note: ${i.returnNote || ''}` : ''], ['Approved by', i.approvedBy?.name], ['Approved on', aAt ? fmtDT(aAt) : ''], ['Approver note', i.approvalNote], ['PSM', i.psmRefer ? `Refer to PSM. ${i.psmReason || ''}` : '']])}</div>` : ''}
    </div>`;
    const actions = [{ label: 'Close', onClick: (x) => x.close() }];
    if (canApprove) { actions.push({ label: 'Return', kind: 'danger', onClick: (x) => { x.close(); returnDlg(i); } }, { label: 'Approve and close', kind: 'primary', onClick: (x) => { x.close(); approveDlg(i); } }); }
    if (canCosign) { actions.push({ label: 'Return', kind: 'danger', onClick: (x) => { x.close(); returnDlg(i); } }, { label: 'Sign off', kind: 'primary', onClick: (x) => { x.close(); signoffDlg(i); } }); }
    if (canAct) actions.push({ label: 'Add containment action', kind: 'primary', onClick: (x) => { x.close(); containDlg(i); } });
    const mm = openModal({ title: `${issueNo(i)}: ${i.station || 'Issue'}`, html: body, wide: true, actions });
    if (seeRep) listIssuesAtStation(i.station).then((fresh) => { const b = mm.el.querySelector('#repbox'); if (b && mm.el.isConnected) b.innerHTML = repeatHtml(repeatOf(i, fresh)); }).catch(() => {});
    if (live) { const tk = setInterval(() => { if (!mm.el.isConnected) { clearInterval(tk); return; } const l = runLoss(i, i.mp, i.mc); const b = mm.el.querySelector('#liveBox'); if (b) b.innerHTML = `Downtime so far: <b>${esc(fmtDur(l.dt * 60))}</b> since the issue was reported (${esc(fmtDT(issueMs(i)))}).`; }, 15000); }
  }

  function extraFields(stage, skip, v = {}) {
    return stageFields(stage).filter((f) => !skip.includes(f.key)).map((f) => {
      const k = f.key, req = f.required ? ' *' : '';
      if (NUMS.has(k)) return `<div><label class="l" for="x_${k}">${esc(f.label)}${req}</label><input id="x_${k}" type="number" min="0" step="any" value="${esc(v[k] ?? '')}"></div>`;
      if (k === 'description' || k === 'approvalNote') return `<div class="full"><label class="l" for="x_${k}">${esc(f.label)}${req}</label><textarea id="x_${k}" rows="2">${esc(v[k] ?? '')}</textarea></div>`;
      return `<div><label class="l" for="x_${k}">${esc(f.label)}${req}</label><input id="x_${k}" value="${esc(v[k] ?? '')}"></div>`;
    }).join('');
  }
  function readExtra(el, stage, skip) {
    const out = {};
    for (const f of stageFields(stage).filter((z) => !skip.includes(z.key))) {
      const raw = clean(el.querySelector('#x_' + f.key)?.value);
      if (f.required && raw === '') return { error: `${f.label} is required.` };
      out[f.key] = NUMS.has(f.key) ? (raw === '' ? 0 : Number(raw)) : raw;
    }
    return { vals: out };
  }

  function containDlg(i) {
    const m = openModal({
      title: `Containment action: ${issueNo(i)}`, wide: true,
      html: `<p class="hint">${esc(i.station || '')} · ${esc(i.description || '')}</p>
        ${i.returnNote ? `<p class="hint" style="color:#b45309">Returned by approver: ${esc(i.returnNote)}</p>` : ''}
        <div id="c_rep">${repeatHtml(repeatOf(i))}</div>
        <div class="est" id="c_est"></div>
        <form class="fg" autocomplete="off"><div class="full"><label class="l" for="c_text">${esc(LABELS.containment || 'Containment action')} *</label><textarea id="c_text" rows="4" maxlength="800"></textarea></div>
        ${extraFields('responsible', ['containment'])}
        <div class="full"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input type="checkbox" id="c_fix" style="width:auto;margin-top:3px"><span>My response was late. I want to enter a corrected loss. The system downtime stays on record unchanged.</span></label></div>
        <div id="c_fixbox" class="full" hidden><div class="fg"><div><label class="l" for="c_loss">Corrected loss (hours) *</label><input id="c_loss" type="number" min="0" step="any"></div>
        <div class="full"><label class="l" for="c_why">Reason for the correction *</label><textarea id="c_why" rows="2" maxlength="400"></textarea></div></div></div></form><div class="err" id="c_err"></div>`,
      actions: [{ label: 'Cancel', onClick: (x) => x.close() }, { label: 'Submit for approval', kind: 'primary', onClick: save }]
    });
    const paintEst = () => {
      const g = (k) => m.el.querySelector('#x_' + k)?.value;
      const l = runLoss(i, g('mp'), g('mc')), b = m.el.querySelector('#c_est'); if (!b) return;
      b.innerHTML = `Downtime so far: <b>${esc(fmtDur(l.dt * 60))}</b> (reported ${esc(fmtDT(issueMs(i)))}). Estimated loss till now: <b>${esc(l.hours)} man-hours</b>${(Number(D.setup.rate) || 0) ? `, cost <b>${esc(inr(l.cost))}</b>` : ''}${Number(g('mp')) ? '' : ' (enter Total MP to see the loss)'}. It keeps growing until you submit.`;
    };
    paintEst(); const tk = setInterval(() => { if (!m.el.isConnected) clearInterval(tk); else paintEst(); }, 15000);
    m.el.addEventListener('input', (e) => { if (/^x_(mp|mc)$/.test(e.target.id)) paintEst(); });
    m.el.querySelector('#c_fix').onchange = (e) => { m.el.querySelector('#c_fixbox').hidden = !e.target.checked; };
    listIssuesAtStation(i.station).then((fresh) => { const b = m.el.querySelector('#c_rep'); if (b) b.innerHTML = repeatHtml(repeatOf(i, fresh)); }).catch(() => {});
    async function save(x, btn) {
      const err = m.el.querySelector('#c_err'); err.textContent = '';
      const text = clean(m.el.querySelector('#c_text').value);
      if (!text) { err.textContent = 'Write the containment action.'; return; }
      const ex = readExtra(m.el, 'responsible', ['containment']); if (ex.error) { err.textContent = ex.error; return; }
      const fix = m.el.querySelector('#c_fix').checked, cl = clean(m.el.querySelector('#c_loss').value), why = clean(m.el.querySelector('#c_why').value);
      if (fix && (cl === '' || Number(cl) < 0)) { err.textContent = 'Enter the corrected loss in hours.'; return; }
      if (fix && !why) { err.textContent = 'Write the reason for the corrected loss.'; return; }
      btn.disabled = true; x.locked = true;
      try {
        const data = await submitContainment(i, me, { containment: text, ...ex.vals, ...(fix ? { correctedLossH: Number(cl), correctedReason: why } : {}) }, D.setup);
        const extra = Object.fromEntries(Object.entries(ex.vals).filter(([k]) => !NUMS.has(k)));
        if (Object.keys(extra).length) await updateIssue(i.id, extra);
        x.locked = false; x.close(); toast('Sent to the approver.');
        await reloadIssues(); show(tab);
      } catch (e) { err.textContent = friendlyError(e); btn.disabled = false; x.locked = false; }
    }
  }

  function approveDlg(i) {
    const m = openModal({
      title: `Approve and close: ${issueNo(i)}`,
      html: `${repeatHtml(repeatOf(i))}<div class="icard act" style="margin:8px 0"><h4>Containment action by ${esc(i.containmentBy?.name || '')}</h4><div class="big">${esc(i.containment || '')}</div>
          <div class="tiles"><div class="tl bad"><small>System downtime</small><b>${esc(i.downtimeH)} h</b></div><div class="tl"><small>Hours lost (system)</small><b>${esc(i.hoursTotal || 0)} h</b></div>${i.lossCorrectedH != null ? `<div class="tl good"><small>Corrected loss by ${esc(i.lossCorrectedBy || '')}</small><b>${esc(i.lossCorrectedH)} h</b></div>` : ''}</div>
          ${i.lossCorrectedH != null ? `<div class="hint" style="margin:0">Corrected loss ${esc(i.lossCorrectedH)} h. Reason: ${esc(i.lossCorrectedReason || '')}</div>` : ''}${i.delayMin != null ? `<div class="hint" style="margin:6px 0 0">Response time ${esc(fmtDur(i.delayMin))}${i.leadResult ? ' · ' + esc(i.leadResult) : ''}</div>` : ''}</div>
        <form class="fg" autocomplete="off">${stageFields('approver').some((f) => f.key === 'approvalNote') ? `<div class="full"><label class="l" for="a_note">${esc(LABELS.approvalNote || 'Approver comment')}${D.setup.fields.approvalNote?.required ? ' *' : ''}</label><textarea id="a_note" rows="3"></textarea></div>` : ''}</form><div class="err" id="a_err"></div>`,
      actions: [{ label: 'Cancel', onClick: (x) => x.close() }, { label: 'Approve and close', kind: 'primary', onClick: save }]
    });
    async function save(x, btn) {
      const note = clean(m.el.querySelector('#a_note')?.value);
      if (D.setup.fields.approvalNote?.required && stageFields('approver').some((f) => f.key === 'approvalNote') && !note) { m.el.querySelector('#a_err').textContent = 'Write a comment.'; return; }
      btn.disabled = true; x.locked = true;
      try {
        const out = await approveIssue(i, me, note, D.setup);
        x.locked = false; x.close(); toast(out.psm?.refer ? 'Closed. Flagged to refer to PSM.' : 'Issue closed.');
        await reloadIssues(); show(tab);
      } catch (e) { m.el.querySelector('#a_err').textContent = friendlyError(e); btn.disabled = false; x.locked = false; }
    }
  }

  function signoffDlg(i) {
    const m = openModal({
      title: `Sign off: ${issueNo(i)}`,
      html: `<p class="hint">Containment by ${esc(i.containmentBy?.name || '')}: ${esc(i.containment || '')}<br>Downtime ${esc(i.downtimeH)} h. Your sign-off is optional and does not close the issue. The initiator closes it.</p>
        <label class="l" for="s_note">Comment (optional)</label><textarea id="s_note" rows="3"></textarea><div class="err" id="s_err"></div>`,
      actions: [{ label: 'Cancel', onClick: (x) => x.close() }, { label: 'Sign off', kind: 'primary', onClick: save }]

  function returnDlg(i) {
    const m = openModal({
      title: `Return to responsible user: ${issueNo(i)}`,
      html: `<p class="hint">The issue goes back to ${esc(i.responsibleName || 'the responsible user')} and any sign-offs are cleared. The escalation time keeps running.</p>
        <label class="l" for="r_note">Reason *</label><textarea id="r_note" rows="3"></textarea><div class="err" id="r_err"></div>`,
      actions: [{ label: 'Cancel', onClick: (x) => x.close() }, { label: 'Return', kind: 'danger', onClick: save }]
    });
    async function save(x, btn) {

  /* ---------- tab: all issues ---------- */
  const flt = { q: '', status: '', area: '', dept: '', cat: '', month: '' };
  function drawAll() {
    const uniq = (k) => [...new Set(D.issues.map((i) => i[k]).filter(Boolean))].sort();
    const months = [...new Set(D.issues.map((i) => (i.dateKey || '').slice(0, 7)).filter(Boolean))].sort().reverse();
    const opt = (arr, cur, all) => `<option value="">${all}</option>` + arr.map((o) => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('');
    view.innerHTML = `<div class="filters"><input id="q" type="search" placeholder="Search station, line or description" value="${esc(flt.q)}" aria-label="Search">
      <select id="s"><option value="">All status</option>${[['open', 'Open'], ['pending', 'Waiting for approval'], ['closed', 'Closed']].map(([k, l]) => `<option value="${k}" ${flt.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="a">${opt(uniq('area'), flt.area, 'All areas')}</select><select id="d">${opt(uniq('respDept'), flt.dept, 'All responsibilities')}</select><select id="c">${opt(uniq('category'), flt.cat, 'All categories')}</select>
      <select id="m">${opt(months, flt.month, 'All months')}</select><span style="flex:1"></span>
      ${ctx.isAdmin || ctx.profile?.canExport ? '<button type="button" class="btn btn-ghost" id="xl"><span>Export Excel</span></button>' : ''}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>No.</th><th>Reported</th><th>Area</th><th>Line</th><th>Station</th><th>Category</th><th>Responsibility</th><th>Status</th><th class="num">Delay</th></tr></thead><tbody id="tb"></tbody></table></div><div class="note" id="nt"></div>`;
    const draw = () => {
      const q = lc(flt.q);
      const list = D.issues.filter((i) => (!flt.status || i.status === flt.status) && (!flt.area || i.area === flt.area) && (!flt.dept || i.respDept === flt.dept) && (!flt.cat || i.category === flt.cat) && (!flt.month || (i.dateKey || '').startsWith(flt.month)) && (!q || lc(`${i.station} ${i.line} ${i.description} ${issueNo(i)}`).includes(q))).sort((a, b) => issueMs(b) - issueMs(a));
      view.querySelector('#tb').innerHTML = list.slice(0, 300).map((i) => `<tr data-id="${esc(i.id)}" style="cursor:pointer"><td data-label="No.">${esc(issueNo(i))}</td><td data-label="Reported">${esc(fmtDT(issueMs(i)))}</td><td data-label="Area">${esc(i.area || '')}</td><td data-label="Line">${esc(i.line || '')}</td><td data-label="Station"><b>${esc(i.station || '')}</b></td><td data-label="Category">${esc(i.category || '')}</td><td data-label="Responsibility">${esc(i.respDept || '')}</td><td data-label="Status">${statusPill(i)}</td><td class="num" data-label="Delay">${i.delayMin != null ? esc(fmtDur(i.delayMin)) : '-'}</td></tr>`).join('') || '<tr><td colspan="9"><div class="empty">No issues match.</div></td></tr>';
      view.querySelector('#nt').textContent = `Showing ${Math.min(list.length, 300)} of ${list.length} matching (${D.issues.length} total). Export Excel downloads all matching issues.`;
      view.querySelectorAll('#tb tr[data-id]').forEach((r) => { r.onclick = () => openIssue(D.issues.find((i) => i.id === r.dataset.id)); });
      view._list = list;
    };
    [['q', 'q', 'input'], ['s', 'status', 'change'], ['a', 'area', 'change'], ['d', 'dept', 'change'], ['c', 'cat', 'change'], ['m', 'month', 'change']].forEach(([id, k, ev]) => { view.querySelector('#' + id).addEventListener(ev, (e) => { flt[k] = e.target.value; draw(); }); });
    if (view.querySelector('#xl')) view.querySelector('#xl').onclick = exportXlsx;
    draw();
  }

  async function exportXlsx() {
    try {
      if (!window.XLSX) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load the Excel writer. Check your internet connection.')); document.head.appendChild(s); });
      const rows = (view._list || []).slice().sort((a, b) => issueMs(a) - issueMs(b)).map((i, n) => ({
        'SN': n + 1, 'Issue No': issueNo(i), 'Issue Report Date & Time': fmtDT(issueMs(i)), 'Week-Month': i.weekMonth || '', 'Dept./Area': i.area || '', 'Line': i.line || '', 'Nature of Issue': i.nature || '', 'Station Name': i.station || '',
        'Model & MSN-PSN': i.model || '', 'Part Number': i.partNumber || '', 'Problem Description': i.description || '', 'Issue Category': i.category || '', 'Responsibility': i.respDept || '',
        'Issue Reported By': i.reportedByName || '', 'Responsible User': i.responsibleName || '', 'Repeatation': i.repeat || '', 'Containment Action': i.containment || '',
        'Containment Action Date & Time': fmtDT(tsMs(i.containmentAt)).replace(/^-$/, ''), 'Delay (Min)': i.delayMin ?? '', 'Lead Time Result': i.leadResult || '', 'Issue Escalation Level': i.status === 'open' ? '' : (i.escalationLevel || ''),
        'Total MP': i.mp || 0, 'No. of M/C': i.mc || 0, 'Downtime (Hours)': i.downtimeH || 0, 'Hours Total': i.hoursTotal || 0, 'Total MH Loss Cost': i.mhCost || 0, 'Corrected Loss (Hours)': i.lossCorrectedH ?? '', 'Corrected Loss Cost': i.lossCorrectedCost ?? '', 'Correction Reason': i.lossCorrectedReason || '',
        'Containment Status': i.status === 'closed' ? (i.psmRefer ? 'Handover to PSM' : 'Closed') : i.status === 'pending' ? 'Waiting for approval' : 'Open'
      }));
      if (!rows.length) { toast('No issues to export.'); return; }
      const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(rows), 'Issues');
      window.XLSX.writeFile(wb, `Issue_Report_${dayKeyOf(new Date())}.xlsx`);
    } catch (e) { toast(e.message || friendlyError(e)); }
  }

  /* ---------- tab: PSM candidates ---------- */
  function drawPsm() {
    const p = D.setup.psm, win = (Number(p.windowDays) || 90) * 86400000, now = Date.now(), g = new Map();
    D.issues.forEach((i) => { if (now - issueMs(i) > win) return; const k = repeatKey(i); (g.get(k) || g.set(k, []).get(k)).push(i); });
    const rows = [...g.values()].filter((a) => a.length >= 2 || a.some((i) => i.psmRefer)).map((a) => {
      const loss = Math.round(a.reduce((s, i) => s + (Number(i.hoursTotal) || 0), 0) * 10) / 10, i0 = a[0];
      const refer = a.some((i) => i.psmRefer) || (Number(p.minRepeats) > 0 && a.length >= p.minRepeats) || (Number(p.minLossHours) > 0 && loss >= p.minLossHours);
      return { i0, n: a.length, loss, refer, last: Math.max(...a.map(issueMs)) };
    }).sort((x, y) => (y.refer - x.refer) || (y.n - x.n) || (y.loss - x.loss));
    view.innerHTML = `<p class="help" style="color:var(--muted);font-size:13.5px;max-width:80ch;margin:0 0 10px">Same station and issue category in the last ${esc(p.windowDays)} days. Refer to PSM when repeats reach ${p.minRepeats > 0 ? esc(p.minRepeats) : 'off'} or loss reaches ${p.minLossHours > 0 ? esc(p.minLossHours) + ' hours' : 'off'}. The PSM (PDCA) page is the next step.</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Area</th><th>Line</th><th>Station</th><th>Category</th><th class="num">Repeats</th><th class="num">Loss hours</th><th>Last</th><th>Status</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td data-label="Area">${esc(r.i0.area || '')}</td><td data-label="Line">${esc(r.i0.line || '')}</td><td data-label="Station"><b>${esc(r.i0.station || '')}</b></td><td data-label="Category">${esc(r.i0.category || '')}</td><td class="num" data-label="Repeats">${r.n}</td><td class="num" data-label="Loss">${r.loss}</td><td data-label="Last">${esc(fmtDT(r.last))}</td><td data-label="Status">${r.refer ? '<span class="pill violet">Refer to PSM</span>' : '<span class="pill">Watching</span>'}</td></tr>`).join('') || '<tr><td colspan="8"><div class="empty">No repeated issues in this period.</div></td></tr>'}
      </tbody></table></div>`;
  }

  /* ---------- tabs ---------- */
  let tab = 'tasks';
  // keep the task list and repeat counts live: reload every minute while the list is showing and no dialog is open
  setInterval(async () => { if (tab !== 'tasks' || document.hidden || document.querySelector('.ov')) return; try { await reloadIssues(); if (tab === 'tasks' && !document.querySelector('.ov')) show('tasks'); } catch { /* keep the current view */ } }, 60000);
  function show(k) {
    tab = k;
    const b = myBuckets(), todo = b.action.length + b.approve.length + b.escalated.length;
    tabsEl.innerHTML = [['raise', 'Raise issue', 0], ['tasks', 'My tasks', todo], ['all', 'All issues', 0], ['psm', 'PSM candidates', 0]].map(([key, l, n]) => `<button type="button" data-k="${key}" class="${key === k ? 'on' : ''}">${l}${n ? `<b>${n}</b>` : ''}</button>`).join('');
    tabsEl.querySelectorAll('button').forEach((el) => { el.onclick = () => show(el.dataset.k); });
    ({ tasks: drawTasks, raise: drawRaise, all: drawAll, psm: drawPsm })[k]();
  }
  show(location.hash === '#tasks' ? 'tasks' : 'raise');   // the page opens on the Raise issue form
</script>
</body>
</html>
