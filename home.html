<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Home | Production WIP Audit</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="js/wip-core.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <style>
    html,body{margin:0;background:#0b1220}
    #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0b1220,#12304f);color:#cbd5e1;font:15px 'Segoe UI',system-ui,sans-serif}
    #boot i{display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#4ade80;animation:bootspin .8s linear infinite}
    #boot p{margin-top:10px;max-width:300px;font-size:13.5px;color:#94a3b8}
    @keyframes bootspin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
  </style>
</head>
<body>
<div id="boot" role="status"><div><i></i>Loading Production WIP Audit…</div></div>
<script>
  // If loading takes unusually long, say what to do instead of staying silent
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b) b.firstElementChild.insertAdjacentHTML('beforeend', '<p>This is taking longer than usual. Check your internet connection, then reload the page.</p>');
  }, 12000);
</script>
<script type="module">
  import {
    startPage, NAV, go, icon, esc, toast, openModal, openProfile,
    startNetwork, getAdminMessage, DEFAULT_ADMIN_MESSAGE,
    listIssues, issueRole, issueNo, fmtDur, levelLabel, issueMs
  } from './js/wip-core.js';

  const ctx = await startPage({ active: 'home', title: 'Home' });
  const main = ctx.main;

  // Tiles, in the order of the design sheet (3 x 3)
  const TILE_KEYS = ['inventory', 'issue', 'improvement', 'multiskilling', 'shift', 'audit', 'inspection', 'psm', 'm5'];
  const tiles = TILE_KEYS.map((k) => NAV.find((n) => n.key === k));

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const today = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const access = ctx.departments.length ? ctx.departments : [];

  main.innerHTML = `
    <section class="band">
      <canvas aria-hidden="true"></canvas>
      <div>
        <h2>${greeting}, ${esc(ctx.name.split(/\s+/)[0])}</h2>
        <p>Pick a module below to continue.</p>
        <div class="chips">
          <span class="chip">${ctx.isAdmin ? 'Administrator' : 'User'}</span>
          ${access.map((d) => `<span class="chip">${esc(d)}</span>`).join('')}
        </div>
      </div>
      <div class="date">${esc(today)}</div>
    </section>

    <section id="issueStrip" hidden></section>

    ${ctx.profile.mustChangePassword ? `
    <div class="alert" id="pwBanner">
      <span>You are using a starting password. Please set your own password.</span>
      <button type="button" class="btn btn-primary btn-sm" id="pwBtn">Change password</button>
    </div>` : ''}

    <section class="tiles" aria-label="Modules">
      ${tiles.map((t) => `
        <button type="button" class="tile" data-k="${t.key}">
          <span class="ico">${icon(t.icon)}</span>
          <span><b>${esc(t.label)}</b>${t.href ? '' : '<small>Coming soon</small>'}</span>
        </button>`).join('')}
    </section>

    <section class="lower">
      <article class="card msg">
        <h2>Admin message</h2>
        <div class="msg-body" id="msgBody"></div>
        <div class="msg-meta" id="msgMeta"></div>
      </article>
      <article class="card core">
        <h2>HDPS core values</h2>
        <div class="core-img"><img src="images/logo.png" alt="HD Hyundai core values: built in quality, just in time, operational stability, continuous improvement, team HD Hyundai, around customer satisfaction" onerror="this.parentElement.innerHTML='<p class=hint>Add images/logo.png to show the core values.</p>'"></div>
      </article>
    </section>

    <footer class="foot">
      <div>
        <button type="button" data-p="cookies">Cookies Policy</button>
        <button type="button" data-p="cookie-settings">Cookie Settings</button>
        <button type="button" data-p="legal">Legal Terms</button>
        <button type="button" data-p="privacy">Privacy Policy</button>
      </div>
      <div>
        <b>Connect:</b>
        <span>Production Innovation</span>
        <span>Vaibhav Chaudhari</span>
        <a href="tel:8956954726">8956954726</a>
      </div>
    </footer>`;


  // Issues for you (top of Home): open issues where this user must act, approve, or is informed or escalated
  (async () => {
    const box = main.querySelector('#issueStrip');
    try {
      const now = Date.now();
      const rows = (await listIssues(['open', 'pending'])).map((i) => ({ i, r: issueRole(i, ctx.uid, now) }))
        .filter((x) => ['action', 'approve', 'cosign', 'escalated', 'info'].includes(x.r.role));
      if (!rows.length) return;
      const rank = { approve: 0, action: 1, cosign: 2, escalated: 3, info: 4 };
      rows.sort((a, b) => rank[a.r.role] - rank[b.r.role] || issueMs(a.i) - issueMs(b.i));
      const tag = (x) => ({ action: 'Add containment', approve: 'Approve containment', cosign: 'Optional approval', escalated: 'Escalated to you (' + levelLabel(x.r.level) + ')', info: 'For information' }[x.r.role]);
      const left = (x) => { if (x.i.status !== 'open') return ''; const m = (x.i.lead?.target ?? 450) - x.r.mins; return m >= 0 ? fmtDur(m) + ' left' : 'Overdue by ' + fmtDur(m); };
      box.innerHTML = `<style>#issueStrip{margin-top:16px;background:#fff;border:1px solid #fecaca;border-left:5px solid #dc2626;border-radius:12px;padding:12px 14px}
        #issueStrip h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
        #issueStrip a.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:7px 0;border-top:1px solid #f1f5f9;color:inherit;text-decoration:none;font-size:13.5px}
        #issueStrip .p{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#dbeafe;color:#1e40af}
        #issueStrip .p.l{background:#fee2e2;color:#991b1b}#issueStrip .p.a{background:#fef3c7;color:#92400e}#issueStrip .p.e{background:#ede9fe;color:#5b21b6}</style>
        <h2><span>Issues for you (${rows.length})</span><a href="issues.html" style="font-size:13px">Open Issue Report</a></h2>
        ${rows.slice(0, 6).map((x) => { const t = left(x); return `<a class="row" href="issues.html"><b>${esc(issueNo(x.i))}</b><span>${esc(x.i.station || '')} · ${esc(x.i.line || '')}</span><span style="flex:1;min-width:120px;color:#52514e">${esc((x.i.description || '').slice(0, 70))}</span>
          <span class="p ${(x.r.role === 'approve' || x.r.role === 'cosign') ? 'a' : x.r.role === 'escalated' ? 'e' : ''}">${esc(tag(x))}</span>${t ? `<span class="p ${t.startsWith('Overdue') ? 'l' : ''}">${esc(t)}</span>` : ''}</a>`; }).join('')}
        ${rows.length > 6 ? `<div style="font-size:12.5px;color:#64748b;padding-top:6px">and ${rows.length - 6} more</div>` : ''}`;
      box.hidden = false;
    } catch { /* the strip is optional: Home works without it */ }
  })();

  startNetwork(main.querySelector('.band canvas'));

  main.querySelectorAll('.tile').forEach((el) => {
    el.onclick = () => go(ctx, NAV.find((n) => n.key === el.dataset.k));
  });
  main.querySelector('#pwBtn')?.addEventListener('click', () => openProfile(ctx));

  // Admin message: saved by an administrator, falls back to the default text
  const msgBody = main.querySelector('#msgBody'), msgMeta = main.querySelector('#msgMeta');
  msgBody.textContent = DEFAULT_ADMIN_MESSAGE;
  getAdminMessage().then((m) => {
    if (!m?.text) return;
    msgBody.textContent = m.text;
    const when = m.updatedAt?.toDate?.();
    if (when) msgMeta.textContent = 'Updated ' + when.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  });

  // Footer pages (draft wording: replace with text approved by your company)
  const POLICIES = {
    cookies: ['Cookies policy', '<p>This site does not use advertising or tracking cookies.</p><p>It stores only what is needed to keep you signed in. This storage is removed when you sign out.</p>'],
    'cookie-settings': ['Cookie settings', '<p>Only essential storage is used, so there is nothing to switch on or off.</p><p>To clear it, use <b>Sign out</b>.</p>'],
    legal: ['Legal terms', '<p>This system is for authorized employees only. Access is monitored and each action is linked to your employee ID.</p><p>Data shown here is confidential company information. Do not copy, share or forward it without permission.</p>'],
    privacy: ['Privacy policy', '<p>The system keeps your name, employee ID, department access and your activity inside the audit modules.</p><p>This information is used only for plant operations and is visible to authorized administrators.</p>']
  };
  main.querySelectorAll('[data-p]').forEach((b) => {
    b.onclick = () => {
      const [title, html] = POLICIES[b.dataset.p];
      openModal({ title, html: html + '<p class="hint">Draft wording. Replace with company-approved text.</p>', actions: [{ label: 'Close', onClick: (m) => m.close() }] });
    };
  });
</script>
</body>
</html>
