<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Home | Production WIP Audit</title>
</head>
<body>
<script type="module">
  import {
    startPage, NAV, go, icon, esc, toast, openModal, openProfile,
    startNetwork, getAdminMessage, DEFAULT_ADMIN_MESSAGE
  } from './js/wip-core.js';

  const ctx = await startPage({ active: 'home', title: 'Home' });
  const main = ctx.main;

  // Tiles, in the order of the design sheet (3 x 3)
  const TILE_KEYS = ['inventory', 'issue', 'improvement', 'multiskilling', 'shift', 'audit', 'inspection', 'psm', 'm5'];
  const tiles = TILE_KEYS.map((k) => NAV.find((n) => n.key === k));

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const today = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const access = ctx.departments.length ? ctx.departments : [];

  main.innerHTML = `
    <section class="band">
      <canvas aria-hidden="true"></canvas>
      <div>
        <h2>${greeting}, ${esc(ctx.name.split(/\s+/)[0])}</h2>
        <p>Pick a module below to continue.</p>
        <div class="chips">
          <span class="chip">${ctx.isAdmin ? 'Administrator' : 'User'}</span>
          ${access.map((d) => `<span class="chip">${esc(d)}</span>`).join('')}
        </div>
      </div>
      <div class="date">${esc(today)}</div>
    </section>

    ${ctx.profile.mustChangePassword ? `
    <div class="alert" id="pwBanner">
      <span>You are using a starting password. Please set your own password.</span>
      <button type="button" class="btn btn-primary btn-sm" id="pwBtn">Change password</button>
    </div>` : ''}

    <section class="tiles" aria-label="Modules">
      ${tiles.map((t) => `
        <button type="button" class="tile" data-k="${t.key}">
          <span class="ico">${icon(t.icon)}</span>
          <span><b>${esc(t.label)}</b>${t.href ? '' : '<small>Coming soon</small>'}</span>
        </button>`).join('')}
    </section>

    <section class="lower">
      <article class="card msg">
        <h2>Admin message</h2>
        <div class="msg-body" id="msgBody"></div>
        <div class="msg-meta" id="msgMeta"></div>
      </article>
      <article class="card core">
        <h2>HDPS core values</h2>
        <div class="core-img"><img src="images/logo.png" alt="HD Hyundai core values: built in quality, just in time, operational stability, continuous improvement, team HD Hyundai, around customer satisfaction" onerror="this.parentElement.innerHTML='<p class=hint>Add images/logo.png to show the core values.</p>'"></div>
      </article>
    </section>

    <footer class="foot">
      <div>
        <button type="button" data-p="cookies">Cookies Policy</button>
        <button type="button" data-p="cookie-settings">Cookie Settings</button>
        <button type="button" data-p="legal">Legal Terms</button>
        <button type="button" data-p="privacy">Privacy Policy</button>
      </div>
      <div>
        <b>Connect:</b>
        <span>Production Innovation</span>
        <span>Vaibhav Chaudhari</span>
        <a href="tel:8956954726">8956954726</a>
      </div>
    </footer>`;

  startNetwork(main.querySelector('.band canvas'));

  main.querySelectorAll('.tile').forEach((el) => {
    el.onclick = () => go(ctx, NAV.find((n) => n.key === el.dataset.k));
  });
  main.querySelector('#pwBtn')?.addEventListener('click', () => openProfile(ctx));

  // Admin message: saved by an administrator, falls back to the default text
  const msgBody = main.querySelector('#msgBody'), msgMeta = main.querySelector('#msgMeta');
  msgBody.textContent = DEFAULT_ADMIN_MESSAGE;
  getAdminMessage().then((m) => {
    if (!m?.text) return;
    msgBody.textContent = m.text;
    const when = m.updatedAt?.toDate?.();
    if (when) msgMeta.textContent = 'Updated ' + when.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  });

  // Footer pages (draft wording: replace with text approved by your company)
  const POLICIES = {
    cookies: ['Cookies policy', '<p>This site does not use advertising or tracking cookies.</p><p>It stores only what is needed to keep you signed in. This storage is removed when you sign out.</p>'],
    'cookie-settings': ['Cookie settings', '<p>Only essential storage is used, so there is nothing to switch on or off.</p><p>To clear it, use <b>Sign out</b>.</p>'],
    legal: ['Legal terms', '<p>This system is for authorized employees only. Access is monitored and each action is linked to your employee ID.</p><p>Data shown here is confidential company information. Do not copy, share or forward it without permission.</p>'],
    privacy: ['Privacy policy', '<p>The system keeps your name, employee ID, department access and your activity inside the audit modules.</p><p>This information is used only for plant operations and is visible to authorized administrators.</p>']
  };
  main.querySelectorAll('[data-p]').forEach((b) => {
    b.onclick = () => {
      const [title, html] = POLICIES[b.dataset.p];
      openModal({ title, html: html + '<p class="hint">Draft wording. Replace with company-approved text.</p>', actions: [{ label: 'Close', onClick: (m) => m.close() }] });
    };
  });
</script>
</body>
</html>
