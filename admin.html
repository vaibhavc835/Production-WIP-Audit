<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Production WIP Audit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; }
    header {
      background: #0f172a;
      color: white;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 17px; }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-left: 8px;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      padding: 10px 20px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active { background: #2563eb; color: white; border-color: #2563eb; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    h2 { font-size: 18px; margin-bottom: 16px; color: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f8fafc; text-align: left; padding: 12px; color: #475569; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
    input, select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr 100px 100px 100px; gap: 10px; margin-bottom: 12px; align-items: end; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #64748b; }
    .section { display: none; }
    .section.active { display: block; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge.admin { background: #dbeafe; color: #1e40af; }
    .badge.user { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>Admin Panel</h1>
    <div>
      <button class="btn" onclick="window.location.href='home.html'">← Back to Home</button>
      <button class="btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-tab="stations">Manage Stations</div>
      <div class="tab" data-tab="users">Manage Users</div>
    </div>

    <!-- STATIONS SECTION -->
    <div class="section active" id="stationsSection">
      <div class="card">
        <h2>Add New Station</h2>
        <div class="form-row">
          <div class="form-group">
            <label>Area</label>
            <select id="newArea"></select>
          </div>
          <div class="form-group">
            <label>Station Name</label>
            <input type="text" id="newName" placeholder="Station name">
          </div>
          <div class="form-group">
            <label>Min</label>
            <input type="number" id="newMin" placeholder="Min">
          </div>
          <div class="form-group">
            <label>Max</label>
            <input type="number" id="newMax" placeholder="Max">
          </div>
          <button class="btn btn-primary" id="addStationBtn">Add</button>
        </div>
      </div>

      <div class="card">
        <h2>All Stations</h2>
        <table>
          <thead>
            <tr>
              <th>Area</th>
              <th>Station</th>
              <th>Min</th>
              <th>Max</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="stationsTable"></tbody>
        </table>
      </div>
    </div>

    <!-- USERS SECTION -->
    <div class="section" id="usersSection">
      <div class="card">
        <h2>Users & Area Access</h2>
        <p style="font-size:13px; color:#64748b; margin-bottom:16px;">
          Note: First create users from Firebase Authentication → Users → Add user. Then assign areas here.
        </p>
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Allowed Areas</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { 
      checkAuth, logoutUser, getUserProfile, ALL_AREAS,
      getAllStations, addStation, updateStation, deleteStation,
      getAllUsers, updateUser
    } from './js/firebase-config.js';

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Section').classList.add('active');
      });
    });

    // Fill area dropdown
    const areaSelect = document.getElementById('newArea');
    areaSelect.innerHTML = ALL_AREAS.map(a => `<option value="${a}">${a}</option>`).join('');

    checkAuth(async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const profile = await getUserProfile(user.uid);
      if (!profile || profile.role !== "admin") {
        alert("Access denied. Only Admin can open this page.");
        window.location.href = "home.html";
        return;
      }

      loadStations();
      loadUsers();
    });

    // ==================== STATIONS ====================
    async function loadStations() {
      const stations = await getAllStations();
      const tbody = document.getElementById('stationsTable');

      if (stations.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px;color:#64748b;">No stations yet. Add some above.</td></tr>`;
        return;
      }

      // Sort by area
      stations.sort((a, b) => a.area.localeCompare(b.area) || a.order - b.order);

      tbody.innerHTML = stations.map(s => `
        <tr>
          <td>${s.area}</td>
          <td>${s.name}</td>
          <td>${s.min}</td>
          <td>${s.max}</td>
          <td>
            <button class="btn btn-danger" onclick="deleteStationConfirm('${s.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('addStationBtn').addEventListener('click', async () => {
      const area = document.getElementById('newArea').value;
      const name = document.getElementById('newName').value.trim();
      const min = Number(document.getElementById('newMin').value);
      const max = Number(document.getElementById('newMax').value);

      if (!name || isNaN(min) || isNaN(max)) {
        alert("Please fill all fields correctly");
        return;
      }

      await addStation({
        area,
        name,
        min,
        max,
        order: Date.now()
      });

      document.getElementById('newName').value = '';
      document.getElementById('newMin').value = '';
      document.getElementById('newMax').value = '';

      loadStations();
      alert("Station added successfully!");
    });

    window.deleteStationConfirm = async (id) => {
      if (confirm("Are you sure you want to delete this station?")) {
        await deleteStation(id);
        loadStations();
      }
    };

    // ==================== USERS ====================
    async function loadUsers() {
      const users = await getAllUsers();
      const tbody = document.getElementById('usersTable');

      if (users.length === 0) {
