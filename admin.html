<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Admin Control | Production WIP Audit</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="js/wip-core.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <style>
    html,body{margin:0;background:#0b1220}
    #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0b1220,#12304f);color:#cbd5e1;font:15px 'Segoe UI',system-ui,sans-serif}
    #boot i{display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#4ade80;animation:bootspin .8s linear infinite}
    #boot p{margin-top:10px;max-width:300px;font-size:13.5px;color:#94a3b8}
    @keyframes bootspin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
  </style>
</head>
<body>
<div id="boot" role="status"><div><i></i>Loading Production WIP Audit…</div></div>
<script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b) b.firstElementChild.insertAdjacentHTML('beforeend', '<p>This is taking longer than usual. Check your internet connection, then reload the page.</p>');
  }, 12000);
</script>
<script type="module">
  import {
    startPage, icon, esc, toast, openModal, confirmBox, friendlyError, DEPARTMENTS,
    listUsers, updateUser, createUser,
    listStations, stationId, saveStation, deleteStation, writeStations,
    getAdminMessage, setAdminMessage, DEFAULT_ADMIN_MESSAGE,
    listInventoryChecks, getInventoryCheck, updateInventoryCheck, deleteInventoryCheck,
    listStationsByDepartment, saveInventoryCheck, deleteInventoryChecksBulk, checkDay,
    ORG_LEVELS, levelLabel, lvOf, getMaster, allMasterDepts, masterDepts, masterLines, masterStationNames, scopeOf, scopeLabel, pageOptions, hasRealMailbox, sendResetLink, RESET_MAILBOX, getTempPassword, STORE_PASSWORDS_FOR_TESTING
  } from './js/wip-core.js';

  const ctx = await startPage({ active: 'admin', adminOnly: true, title: 'Admin Control' });
  const main = ctx.main;
  let MST = await getMaster().catch(() => ({ stations: [], inv: [], has: false }));   // also refreshes the inventory department list

  const state = { users: [], stations: [], checks: [], message: null, tab: 'users', loaded: { users: false, stations: false, checks: false } };
  const clean = (v) => String(v ?? '').replace(/\s+/g, ' ').trim();
  const nk = (k) => String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
  const opts = (list, sel, blank) => (blank ? `<option value="">${blank}</option>` : '') +
    list.map((o) => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');
  const fixDept = (d) => DEPARTMENTS.find((x) => x.toLowerCase() === clean(d).toLowerCase()) || clean(d);
  const pad2 = (n) => String(n).padStart(2, '0');
  const localKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  // The date of the check itself (not the day it was uploaded)
  // Shifts: 1 = 06:30-15:00, 2 = 15:01-23:30, 3 = 23:31-06:29 (the night shift belongs to the day it started).
  // Checks without a recorded time (imported or past entries) are placed in shift 1.
  const shiftOf = (c) => {
    const d = !c.backdated && !c.imported && c.createdAt?.toDate ? c.createdAt.toDate() : null;
    if (!d) return { day: checkKey(c), shift: 1 };
    const m = d.getHours() * 60 + d.getMinutes();
    if (m >= 390 && m <= 900) return { day: localKey(d), shift: 1 };
    if (m > 900 && m <= 1410) return { day: localKey(d), shift: 2 };
    if (m > 1410) return { day: localKey(d), shift: 3 };
    const p = new Date(d); p.setDate(p.getDate() - 1); return { day: localKey(p), shift: 3 };
  };
  const checkKey = (c) => c.dateKey || (c.createdAt?.toDate ? localKey(c.createdAt.toDate()) : '');
  const fmtDay = (key) => key ? new Date(key + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
  // Reads an Excel date: real date cell, Excel serial number, 2026-11-05, 05-11-2026 (day first), or 5 Nov 2026
  function parseExcelDate(v) {
    const ok = (y, m, d) => { const t = new Date(y, m - 1, d); return y >= 2000 && t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d ? `${y}-${pad2(m)}-${pad2(d)}` : null; };
    if (v instanceof Date && !isNaN(v)) return ok(v.getFullYear(), v.getMonth() + 1, v.getDate());
    if (typeof v === 'number' && v > 20000 && v < 80000) { const t = new Date(Math.round((v - 25569) * 86400000)); return ok(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
    const t = String(v ?? '').trim(); if (!t) return null;
    let m;
    if ((m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
    if ((m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) return ok(+m[3], +m[2], +m[1]);
    const MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    if ((m = t.match(/^(\d{1,2})[\s\-\/.,]+([A-Za-z]{3,9})[\s\-\/.,]+(\d{2}|\d{4})$/))) {
      const mo = MON.indexOf(m[2].slice(0, 3).toLowerCase()), y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
      if (mo >= 0) return ok(y, mo + 1, +m[1]);
    }
    const d = new Date(t); if (!isNaN(d) && /[a-z]/i.test(t)) return ok(d.getFullYear(), d.getMonth() + 1, d.getDate());
    return null;
  }
  const STATION_DEPTS = DEPARTMENTS.filter((d) => d !== 'All');
  const stationDepts = (current) => (current && !STATION_DEPTS.includes(current) ? [...STATION_DEPTS, current] : STATION_DEPTS);

  /* ---------- Layout ---------- */
  main.innerHTML = `
    <div class="page-head"><h1>Admin Control</h1>
      <p>Manage who can sign in, the station limits, past inventory checks, and the message shown on Home.</p></div>
    <div class="tiles" id="tabs">
      <button type="button" class="tile" data-t="users"><span class="ico">${icon('users')}</span><span><b>User Database</b><small id="cUsers">Loading</small></span></button>
      <button type="button" class="tile" data-t="master"><span class="ico">${icon('db')}</span><span><b>Master Data</b><small id="cInv">Loading</small></span></button>
      <button type="button" class="tile" data-t="history"><span class="ico">${icon('clipboard')}</span><span><b>Inventory History</b><small id="cHist">View / Add past checks</small></span></button>
      <button type="button" class="tile" data-t="issuesetup"><span class="ico">${icon('alert')}</span><span><b>Issue Setup</b><small>Masters, lead time, fields</small></span></button>
      <button type="button" class="tile" data-t="improvementsetup"><span class="ico">${icon('trend')}</span><span><b>Improvement Setup</b><small>Lines, codes, stations, users</small></span></button>
      <button type="button" class="tile" data-t="auditforms"><span class="ico">${icon('clipboard')}</span><span><b>Audit Forms</b><small>Create audit checklists</small></span></button>
      <button type="button" class="tile" data-t="database"><span class="ico">${icon('db')}</span><span><b>Database</b><small>Download all, delete trial data</small></span></button>
      <button type="button" class="tile" data-t="message"><span class="ico">${icon('msg')}</span><span><b>Admin Message</b><small>Shown on Home</small></span></button>
    </div>
    <section id="panel" class="panel"></section>`;
  const panel = main.querySelector('#panel');

  function updateTiles() {
    const admins = state.users.filter((u) => u.role === 'admin').length;
    main.querySelector('#cUsers').textContent = state.loaded.users ? `${state.users.length} users, ${admins} admin${admins === 1 ? '' : 's'}` : 'Loading';
    main.querySelector('#cInv').textContent = MST.has ? `${MST.stations.length} stations, ${MST.inv.length} inventory points` : 'Not set up yet';
    main.querySelector('#cHist').textContent = state.loaded.checks ? `${state.checks.length} checks` : 'View / Add past checks';
    main.querySelectorAll('#tabs .tile').forEach((t) => t.classList.toggle('on', t.dataset.t === state.tab));
  }
  main.querySelectorAll('#tabs .tile').forEach((t) => { t.onclick = () => { location.hash = t.dataset.t; }; });
  const route = () => {
    const h = location.hash.replace('#', '');
    state.tab = ['users', 'inventory', 'master', 'history', 'issuesetup', 'improvementsetup', 'auditforms', 'database', 'message'].includes(h) ? h : 'users';
    updateTiles();
    ({ users: renderUsers, inventory: renderInventory, master: renderMasterTab, history: renderHistory, issuesetup: renderIssueSetupTab, improvementsetup: renderImpSetupTab, auditforms: renderAuditTab, database: renderDatabaseTab, message: renderMessage })[state.tab]();
  };
  window.addEventListener('hashchange', route);

  const errorBox = (e) => `<div class="empty"><b>Could not load data.</b><p>${esc(friendlyError(e))}</p></div>`;

  const inflight = {};
  function load(which) {
    return inflight[which] || (inflight[which] = (async () => {
      try {
        if (which === 'users') state.users = (await listUsers()).map((u) => ({ ...u, departments: Array.isArray(u.departments) ? u.departments : (u.departments ? [String(u.departments)] : []) }));
        else if (which === 'stations') state.stations = await listStations();
        else if (which === 'checks') state.checks = await listInventoryChecks();
        state.loaded[which] = true;
        return null;
      } catch (e) { delete inflight[which]; return e; }
    })());
  }

  /* ---------- Excel helpers ---------- */
  let xlsxP;
  const loadXLSX = () => xlsxP || (xlsxP = new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxP = null; rej(new Error('Could not load the Excel reader. Check your internet connection.')); };
    document.head.appendChild(s);
  }));

  function pickFile() {
    return new Promise((resolve) => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.xlsx,.xls,.xlsm';
      inp.onchange = () => resolve(inp.files[0] || null);
      inp.click();
    });
  }

  async function readSheet(file, mustHave) {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    for (const name of wb.SheetNames) {
      const ws = wb.Sheets[name];
      const head = (X.utils.sheet_to_json(ws, { header: 1, defval: '' })[0] || []).map(nk);
      if (mustHave.every((k) => head.includes(k))) {
        const rows = X.utils.sheet_to_json(ws, { defval: '' }).map((r) => {
          const o = {}; Object.keys(r).forEach((k) => { o[nk(k)] = r[k]; }); return o;
        });
        return { sheet: name, rows };
      }
    }
    throw new Error('Could not find the expected columns in this file.');
  }

  /* ---------- Users (same as before) ---------- */
  const userSort = (a, b) => (a.userNo ?? 1e9) - (b.userNo ?? 1e9) || String(a.name).localeCompare(String(b.name));

  async function renderUsers() {
    if (!state.loaded.users) {
      panel.innerHTML = '<div class="empty">Loading users…</div>';
      const e = await load('users');
      updateTiles();
      if (e) { panel.innerHTML = errorBox(e); return; }
      if (state.tab !== 'users') return;
    }
    panel.innerHTML = `
      <div class="toolbar">
        <div class="search">${icon('search')}<input id="uq" type="search" placeholder="Search name or employee ID" aria-label="Search users"></div>
        <select id="ud" aria-label="Filter by department"><option value="">All departments</option>${DEPARTMENTS.filter((d) => d !== 'All').map((d) => `<option>${esc(d)}</option>`).join('')}</select>
        <select id="ur" aria-label="Filter by role"><option value="">All roles</option><option value="admin">Admin</option><option value="user">User</option></select>
        <span style="flex:1"></span>
        <button type="button" class="btn btn-ghost" id="uTpl"><span>Download template</span></button>
        <button type="button" class="btn btn-ghost" id="uImp">${icon('upload')}<span>Import Excel</span></button>
        <button type="button" class="btn btn-primary" id="uAdd">${icon('plus')}<span>Add user</span></button>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>No.</th><th>Employee name</th><th>User ID</th><th>Role</th><th>Level</th><th>Assigned to</th><th>Reports to</th><th>Access departments</th><th>Page access</th><th>Status</th><th></th>
      </tr></thead><tbody id="ub"></tbody></table></div>
      <div class="note" id="uNote"></div>`;
    const f = () => drawUsers();
    panel.querySelector('#uq').oninput = f; panel.querySelector('#ud').onchange = f; panel.querySelector('#ur').onchange = f;
    panel.querySelector('#uAdd').onclick = () => userDialog(null);
    panel.querySelector('#uImp').onclick = importUsers;
    panel.querySelector('#uTpl').onclick = downloadUserTemplate;
    drawUsers();
  }

  function drawUsers() {
    const q = clean(panel.querySelector('#uq').value).toLowerCase();
    const d = panel.querySelector('#ud').value, r = panel.querySelector('#ur').value;
    const list = state.users.slice().sort(userSort).filter((u) =>
      (!q || String(u.name).toLowerCase().includes(q) || String(u.employeeId).toLowerCase().includes(q)) &&
      (!d || (u.departments || []).includes(d) || (u.departments || []).includes('All')) &&
      (!r || u.role === r));
    const tb = panel.querySelector('#ub');
    tb.innerHTML = list.map((u, i) => {
      const me = u.uid === ctx.uid, off = u.active === false;
      return `<tr>
        <td data-label="No.">${esc(u.userNo ?? i + 1)}</td>
        <td data-label="Employee name"><b>${esc(u.name)}</b></td>
        <td data-label="User ID">${esc(u.employeeId)}</td>
        <td data-label="Role"><span class="badge ${u.role === 'admin' ? 'admin' : ''}">${u.role === 'admin' ? 'Admin' : 'User'}</span></td>
        <td data-label="Level">${esc(levelLabel(u.level))}</td>
        <td data-label="Assigned to">${esc(scopeLabel(u) || '-')}</td>
        <td data-label="Reports to">${esc(state.users.find((z) => z.uid === u.reportsTo)?.name || '-')}</td>
        <td data-label="Departments">${esc((u.departments || []).join(', '))}</td>
        <td data-label="Page access">${u.role === 'admin' || u.canExport ? '<span class="badge" title="Can export data">Export</span> ' : ''}${u.role === 'admin' || !Array.isArray(u.pages) ? 'All pages' : `<span title="${esc(pageOptions().filter((p) => u.pages.includes(p.key)).map((p) => p.label).join(', ') || 'Home only')}">${u.pages.filter((k) => pageOptions().some((p) => p.key === k)).length} of ${pageOptions().length}</span>`}</td>
        <td data-label="Status"><span class="badge ${off ? 'off' : ''}">${off ? 'Inactive' : 'Active'}</span></td>
        <td class="acts-td"><div class="acts">
          <button type="button" class="btn btn-ghost btn-sm" data-e="${esc(u.uid)}">${icon('edit')}<span>Edit</span></button>
          ${me || (!u.mustChangePassword && !STORE_PASSWORDS_FOR_TESTING) ? '' : `<button type="button" class="btn btn-ghost btn-sm" data-p="${esc(u.uid)}">Temp password</button>`}
          ${me ? '' : `<button type="button" class="btn btn-ghost btn-sm" data-r="${esc(u.uid)}">Reset password</button>`}
          ${me ? '' : `<button type="button" class="btn btn-sm ${off ? 'btn-ghost' : 'btn-danger'}" data-t="${esc(u.uid)}">${off ? 'Activate' : 'Deactivate'}</button>`}
        </div></td></tr>`;
    }).join('') || `<tr><td colspan="11"><div class="empty">${state.users.length ? 'No users match these filters.' : 'No users yet. Add one, or import your Excel file.'}</div></td></tr>`;
    panel.querySelector('#uNote').textContent = `Showing ${list.length} of ${state.users.length} users`;
    tb.querySelectorAll('[data-e]').forEach((b) => { b.onclick = () => userDialog(state.users.find((u) => u.uid === b.dataset.e)); });
    tb.querySelectorAll('[data-p]').forEach((b) => { b.onclick = () => showTemp(state.users.find((u) => u.uid === b.dataset.p)); });
    tb.querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => resetPassword(state.users.find((u) => u.uid === b.dataset.r)); });
    tb.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => toggleUser(state.users.find((u) => u.uid === b.dataset.t)); });
  }

  async function showTemp(u) {
    const pw = await getTempPassword(u.uid);
    openModal({
      title: 'Temporary password',
      html: pw
        ? `<p>Current password of ${esc(u.name)} (testing mode):</p><p style="font-size:1.3rem;font-weight:700;letter-spacing:.04em;user-select:all">${esc(pw)}</p><p class="muted">${STORE_PASSWORDS_FOR_TESTING ? 'Testing mode is on, so changed passwords are shown too. Turn it off before launch.' : 'It disappears from here as soon as they set their own password.'}</p>`
        : `<p>No temporary password is stored for ${esc(u.name)}. It is kept only for accounts created, or passwords changed, after this version was installed. For older accounts, ask the user to change their password once and it will be stored.</p>`,
      actions: [{ label: 'Close', kind: 'primary', onClick: (x) => x.close() }]
    });
  }

  async function resetPassword(u) {
    if (!hasRealMailbox(u.email)) {
      openModal({
        title: 'Reset password by email',
        html: `<p>${esc(u.name)} signs in with an internal address (<b>${esc(u.email || '-')}</b>) that has no mailbox, so a reset link cannot be delivered.</p>
          <p>Only accounts created after the reset mailbox is set up in the site files get a login address that reaches your inbox.${RESET_MAILBOX ? '' : ' The reset mailbox is not set up yet.'}</p>`,
        actions: [{ label: 'Close', kind: 'primary', onClick: (x) => x.close() }]
      });
      return;
    }
    const ok = await confirmBox({ title: 'Reset password by email', message: `A reset link for ${u.name} (${u.email}) will be emailed to ${u.email}. Open that email, choose a temporary password, and tell ${u.name}. They will be asked to change it after signing in. Their current password stays valid until the link is used.`, okLabel: 'Send reset link' });
    if (!ok) return;
    try { await sendResetLink(u.uid, u.email); u.mustChangePassword = true; toast('Reset link sent to ' + u.email + '.'); }
    catch (e) { toast(friendlyError(e)); }
  }

  async function toggleUser(u) {
    const off = u.active !== false;
    const ok = await confirmBox({
      title: off ? 'Deactivate user' : 'Activate user',
      message: off ? `${u.name} will no longer be able to open the system. You can activate them again later.` : `${u.name} will be able to sign in again.`,
      okLabel: off ? 'Deactivate' : 'Activate', danger: off
    });
    if (!ok) return;
    try { await updateUser(u.uid, { active: !off }); u.active = !off; drawUsers(); toast(off ? 'User deactivated.' : 'User activated.'); }
    catch (e) { toast(friendlyError(e)); }
  }

  const genPw = () => { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const a = crypto.getRandomValues(new Uint32Array(8)); a.forEach((n) => { s += c[n % c.length]; }); return s; };

  function userDialog(u) {
    const edit = !!u, me = edit && u.uid === ctx.uid;
    const m = openModal({
      title: edit ? 'Edit user' : 'Add user',
      html: `<form id="uf" class="fg" autocomplete="off">
        <div class="full"><label class="l" for="f_name">Employee name</label><input id="f_name" value="${esc(u?.name || '')}"></div>
        <div><label class="l" for="f_id">User ID (employee ID)</label><input id="f_id" value="${esc(u?.employeeId || '')}" ${edit && u.employeeId ? 'disabled' : ''} inputmode="numeric">${edit && !u.employeeId ? '<div class="hint">This profile has no ID yet. Enter it here.</div>' : ''}</div>
        <div><label class="l" for="f_role">Role</label><select id="f_role" ${me ? 'disabled' : ''}><option value="user" ${u?.role !== 'admin' ? 'selected' : ''}>User</option><option value="admin" ${u?.role === 'admin' ? 'selected' : ''}>Admin</option></select>${me ? '<div class="hint">You cannot change your own role.</div>' : ''}</div>
        ${edit ? '' : `<div class="full"><label class="l" for="f_pw">Starting password</label><div class="row"><input id="f_pw" type="text" autocomplete="off"><button type="button" class="btn btn-ghost" id="f_gen">Generate</button></div><div class="hint">Tell the user this password. They will be asked to change it after signing in.</div></div>`}
        <div class="full"><label class="l">Access departments (tick one or more)</label>
          <div class="deptgrid" id="f_deps">${[...new Set(['All', ...allMasterDepts(MST), ...DEPARTMENTS, ...(u?.departments || [])])].map((d) => `<label><input type="checkbox" value="${esc(d)}" ${(u?.departments || []).includes(d) || ((u?.departments || []).includes('All') && d === 'All') ? 'checked' : ''}> ${d === 'All' ? 'All departments' : esc(d)}</label>`).join('')}</div>
          <style>.deptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;padding:10px;border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto}.deptgrid label{display:flex;gap:6px;align-items:center;font-size:14px}.deptgrid input{width:auto}</style></div>
        <div class="full"><label class="pgall" style="margin:0"><input type="checkbox" id="f_exp" ${u?.canExport || u?.role === 'admin' ? 'checked' : ''} ${u?.role === 'admin' ? 'disabled' : ''}> Can download (export) data to Excel</label><div class="hint">Controls the Export buttons on the Dashboard, Issue Report and Improvement pages. Administrators can always export.</div></div>
        <div class="full"><label class="l">Page access</label>
          <label class="pgall"><input type="checkbox" id="f_pall" ${!Array.isArray(u?.pages) ? 'checked' : ''}> All pages (new pages are included automatically)</label>
          <div class="deptgrid" id="f_pages">${pageOptions().map((p) => `<label><input type="checkbox" value="${esc(p.key)}" ${!Array.isArray(u?.pages) || u.pages.includes(p.key) ? 'checked' : ''}> ${esc(p.label)}</label>`).join('')}</div>
          <div class="hint">Home, About and User Profile are always available. Administrators can open every page.</div><style>.pgall{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:8px}.pgall input{width:auto}</style></div>
        <div><label class="l" for="f_lv">Organization level</label><select id="f_lv">${ORG_LEVELS.map((l) => `<option value="${l.n}" ${(u ? lvOf(u.level) : 1) === l.n ? 'selected' : ''}>${esc(l.label)}</option>`).join('')}</select></div>
        <div class="full"><label class="l">Works at (optional)</label>
          <div class="fg" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><div><select id="f_sd" aria-label="Department"></select></div><div id="w_sl"><select id="f_sl" aria-label="Line"></select></div><div id="w_ss"><select id="f_ss" aria-label="Station"></select></div></div>
          <div class="hint" id="f_sh"></div></div>
        <div class="full"><label class="l" for="f_rt">Reports to</label><select id="f_rt"></select><div class="hint" id="f_rh">Used for issue escalation and approval.</div></div>
      </form><div class="err" id="f_err"></div>`,
      actions: [

  // Page Access column: blank or "All" = every page; otherwise page names separated by commas (for example: Inventory, Audit)
  function parsePages(v) {
    const t = clean(v);
    if (!t || /^all/i.test(t)) return null;
    const opts = pageOptions(), keys = new Set();
    t.split(/[,;\/]/).map((x) => clean(x).toLowerCase()).filter(Boolean).forEach((x) => { const o = opts.find((p) => p.label.toLowerCase() === x || p.key === x); if (o) keys.add(o.key); });
    return [...keys];
  }

  async function importUsers() {
    const file = await pickFile(); if (!file) return;
    let parsed;
    try { parsed = await readSheet(file, ['userid', 'employeename']); }
    catch (e) { toast(e.message); return; }
    const exist = new Set(state.users.map((u) => String(u.employeeId)));
    const M = await getMaster(); MST = M;
    const rows = parsed.rows.map((r, i) => ({ sd: clean(r.assigneddepartment), sl: clean(r.assignedline), ss: clean(r.assignedstation),
      userNo: Number(r.userno) || i + 1, name: clean(r.employeename), employeeId: clean(r.userid),
      level: lvOf(String(r.level ?? r.organizationlevel ?? '').match(/[0-5]/)?.[0]), reportsToId: clean(r.reportstouserid ?? r.reportsto ?? r.reportstoid ?? r.superiorid), role: /^admin/i.test(clean(r.role)) ? 'admin' : 'user', pages: parsePages(r.pageaccess ?? r.pages),
      password: String(r.userpassword ?? '').trim(), departments: [...new Set(Object.keys(r).filter((k) => /^(accessdepartment|departments?)\d*$/.test(k)).flatMap((k) => String(r[k] ?? '').split(/[,;\/]/)).map(fixDept).filter(Boolean))]
    })).filter((r) => r.name || r.employeeId);
    rows.forEach((r) => {
      if (r.departments.includes('All')) r.departments = ['All'];
      // assigned area: match Master Data (any capitalisation), keep only what the level needs
      r.scope = { dept: '', line: '', station: '' }; r.notes = [];
      if (r.sd === '-') r.sd = ''; if (r.sl === '-') r.sl = ''; if (r.ss === '-') r.ss = '';
      if (r.sd) {
        const d = M.has ? masterDepts(M).find((x) => x.toLowerCase() === r.sd.toLowerCase()) : r.sd;
        if (!d) r.notes.push(`Department “${r.sd}” is not in Master Data`);
        else {
          r.scope.dept = d;
          if (r.sl && r.level <= 2) { const l = M.has ? masterLines(M, d).find((x) => x.toLowerCase() === r.sl.toLowerCase()) : r.sl; if (!l) r.notes.push(`Line “${r.sl}” is not in ${d}`); else { r.scope.line = l; if (r.ss && r.level === 0) { const st = M.has ? masterStationNames(M, d, l).find((x) => x.toLowerCase() === r.ss.toLowerCase()) : r.ss; if (!st) r.notes.push(`Station “${r.ss}” is not on ${l}`); else r.scope.station = st; } } }
        }
      }
      if (r.reportsToId === '-') r.reportsToId = '';
      r.problem = !r.name ? 'Name missing' : !r.employeeId ? 'ID missing' : r.password.length < 6 ? 'Password under 6 characters'
        : !r.departments.length ? 'Department missing' : exist.has(r.employeeId) ? 'Already added' : '';
    });
    const todo = rows.filter((r) => !r.problem), skipped = rows.filter((r) => r.problem);
    const weak = todo.filter((r) => r.password === r.employeeId).length;
    const noted = todo.filter((r) => r.notes.length);

    const m = openModal({
      title: 'Import users', wide: true,
      html: `<p>Found <b>${rows.length}</b> rows in sheet “${esc(parsed.sheet)}”: <b>${todo.length}</b> ready to create, <b>${skipped.length}</b> skipped.</p>
        <p class="hint">The password column is used once to create each login. It is not saved in the database. Delete it from the Excel file afterwards.</p>
        ${weak ? `<p class="hint"><b>${weak}</b> users have a password equal to their ID. They will be asked to change it at first sign-in. Users get the role in the Role column (User if blank).</p>` : ''}
        ${noted.length ? `<p class="hint"><b>${noted.length}</b> users will be created without the assigned area that did not match Master Data: ${esc(noted.slice(0, 4).map((r) => r.name + ' (' + r.notes[0] + ')').join('; '))}${noted.length > 4 ? ' …' : ''}</p>` : ''}
        ${skipped.length ? `<table class="sum"><tr><th>Skipped</th><th>User ID</th><th>Reason</th></tr>${skipped.slice(0, 12).map((r) => `<tr><td>${esc(r.name)}</td><td>${esc(r.employeeId)}</td><td>${esc(r.problem)}</td></tr>`).join('')}</table>` : ''}
        <div class="prog" id="ip" hidden><i></i></div><div class="hint" id="it"></div><div class="err" id="ie"></div>`,
      actions: [
        { label: 'Cancel', id: 'cancel', onClick: (x) => x.close() },
        { label: `Create ${todo.length} users`, kind: 'primary', id: 'go', onClick: run }
      ]
    });
    if (!todo.length) m.buttons.go.disabled = true;

    async function run(x, btn) {
      x.locked = true; btn.disabled = true; x.buttons.cancel.disabled = true;
      const bar = x.el.querySelector('#ip'), txt = x.el.querySelector('#it'); bar.hidden = false;
      const fails = []; let ok = 0;
      for (let i = 0; i < todo.length; i++) {
        const r = todo[i];
        txt.textContent = `Creating ${i + 1} of ${todo.length}: ${r.name}`;
        try {
          state.users.push(await createUser({ employeeId: r.employeeId, name: r.name, password: r.password, departments: r.departments, userNo: r.userNo, level: r.level, role: r.role, pages: r.pages, scopeDept: r.scope.dept, scopeLine: r.scope.line, scopeStation: r.scope.station }));
          ok++;
        } catch (e) { fails.push(`${r.name} (${r.employeeId}): ${friendlyError(e)}`); }
        bar.firstElementChild.style.width = Math.round(((i + 1) / todo.length) * 100) + '%';
      }
      // second pass: set "Reports to" once everyone exists (a superior may appear later in the file)
      for (const r of todo) {
        if (!r.reportsToId) continue;
        const me = state.users.find((z) => String(z.employeeId) === r.employeeId), boss = state.users.find((z) => String(z.employeeId) === r.reportsToId);
        if (me && boss && lvOf(boss.level) !== lvOf(me.level) + 1) { fails.push(`${r.name}: reports-to ${r.reportsToId} ignored (must be exactly one level above)`); continue; }
        if (me && boss && me.uid !== boss.uid) { try { await updateUser(me.uid, { reportsTo: boss.uid }); me.reportsTo = boss.uid; } catch { /* ignore */ } }
      }
      x.locked = false; x.buttons.cancel.disabled = false; x.buttons.cancel.textContent = 'Close';
      txt.textContent = `Done: ${ok} created, ${fails.length} need attention.`;
      if (fails.length) x.el.querySelector('#ie').innerHTML = fails.slice(0, 8).map(esc).join('<br>');
      updateTiles(); drawUsers();
    }
  }

  async function removeStation(s) {
    const ok = await confirmBox({ title: 'Delete station', message: `Delete “${s.stationName}” from ${s.line}? This cannot be undone.`, okLabel: 'Delete', danger: true });
    if (!ok) return;
    try { await deleteStation(s.id); state.stations = state.stations.filter((x) => x.id !== s.id); updateTiles(); drawStations(); toast('Station deleted.'); }
    catch (e) { toast(friendlyError(e)); }
  }

  function stationDialog(s) {
    const edit = !!s;
    const dl = (id, vals) => `<datalist id="${id}">${[...new Set(vals)].map((v) => `<option value="${esc(v)}">`).join('')}</datalist>`;
    const m = openModal({
      title: edit ? 'Edit station' : 'Add station',
      html: `<form class="fg" autocomplete="off">
        <div><label class="l" for="s_d">Department</label><select id="s_d">${opts(stationDepts(s?.department), s?.department || '', 'Select department')}</select></div>
        <div><label class="l" for="s_l">Line</label><input id="s_l" list="dl_l" value="${esc(s?.line || '')}"></div>
        <div><label class="l" for="s_c">Station code</label><input id="s_c" value="${esc(s?.stationCode || '')}"><div class="hint">Optional.</div></div>
        <div><label class="l" for="s_n">Station name</label><input id="s_n" value="${esc(s?.stationName || '')}"></div>
        <div><label class="l" for="s_min">Minimum</label><input id="s_min" type="number" min="0" step="1" value="${esc(s?.min ?? '')}"></div>
        <div><label class="l" for="s_max">Maximum</label><input id="s_max" type="number" min="0" step="1" value="${esc(s?.max ?? '')}"></div>
      </form>${dl('dl_l', state.stations.map((x) => x.line))}<div class="err" id="s_err"></div>`,
      actions: [
        { label: 'Cancel', onClick: (x) => x.close() },
        { label: edit ? 'Save changes' : 'Add station', kind: 'primary', onClick: save }
      ]
    });
    const $ = (id) => m.el.querySelector('#' + id);
    async function save(x, btn) {
      const data = {
        department: clean($('s_d').value), line: clean($('s_l').value), stationCode: clean($('s_c').value),
        stationName: clean($('s_n').value), min: Number($('s_min').value), max: Number($('s_max').value)
      };
      const err = $('s_err'); err.textContent = '';
      if (!data.department || !data.line || !data.stationName) { err.textContent = 'Department, line and station name are required.'; return; }
      if (!Number.isFinite(data.min) || !Number.isFinite(data.max) || $('s_min').value === '' || $('s_max').value === '' || data.min < 0 || data.max < 0) { err.textContent = 'Enter minimum and maximum as numbers, zero or more.'; return; }
      if (data.min > data.max) { err.textContent = 'Minimum cannot be higher than maximum.'; return; }
      const id = edit ? s.id : stationId(data);
      if (!edit && state.stations.some((z) => z.id === id)) { err.textContent = 'This station already exists in that line.'; return; }
      btn.disabled = true; x.locked = true;
      try {
        const order = edit ? s.order : Math.max(0, ...state.stations.map((z) => z.order ?? 0)) + 1;
        await saveStation(id, { ...data, order });
        if (edit) Object.assign(s, data); else state.stations.push({ id, ...data, order });
        x.locked = false; x.close(); updateTiles(); renderInventory(); toast(edit ? 'Changes saved.' : 'Station added.');
      } catch (e) { err.textContent = friendlyError(e); btn.disabled = false; x.locked = false; }
    }
  }

  async function importStations() {
    const file = await pickFile(); if (!file) return;
    let parsed;
    try { parsed = await readSheet(file, ['department', 'line', 'stationname', 'min', 'max']); }
    catch (e) { toast(e.message); return; }
    const used = new Set(), rows = [], bad = [];
    parsed.rows.forEach((r, i) => {
      const s = { department: fixDept(r.department), line: clean(r.line), stationCode: clean(r.stationcode), stationName: clean(r.stationname), min: Number(r.min), max: Number(r.max), order: i + 1 };
      if (!s.department && !s.stationName) return;
      if (!s.department || !s.line || !s.stationName) return bad.push([i + 2, 'Department, line or station name missing']);
      if (!STATION_DEPTS.includes(s.department)) return bad.push([i + 2, `Unknown department “${s.department}”. Add it to DEPARTMENTS in wip-core.js first`]);
      if (!Number.isFinite(s.min) || !Number.isFinite(s.max) || r.min === '' || r.max === '') return bad.push([i + 2, 'Min or max is not a number']);
      if (s.min > s.max) return bad.push([i + 2, 'Min is higher than max']);
      let id = stationId(s), n = 2; const base = id;
      while (used.has(id)) id = `${base}-${n++}`;
      used.add(id); rows.push({ id, ...s });
    });
    const have = new Set(state.stations.map((s) => s.id));
    const fresh = rows.filter((r) => !have.has(r.id)).length;
    const byDept = {}; rows.forEach((r) => { byDept[r.department] = (byDept[r.department] || 0) + 1; });

    const m = openModal({
      title: 'Import stations', wide: true,
      html: `<p>Found <b>${rows.length}</b> stations in sheet “${esc(parsed.sheet)}”: <b>${fresh}</b> new, <b>${rows.length - fresh}</b> already in the database.</p>
        <table class="sum"><tr><th>Department</th><th>Stations</th></tr>${Object.entries(byDept).map(([d, n]) => `<tr><td>${esc(d)}</td><td>${n}</td></tr>`).join('')}</table>
        ${bad.length ? `<p class="hint"><b>${bad.length}</b> rows skipped: ${bad.slice(0, 5).map(([r, why]) => `row ${r} (${esc(why)})`).join(', ')}</p>` : ''}
        <div style="margin-top:14px"><label style="display:block;margin-bottom:6px"><input type="radio" name="mode" value="merge" checked style="width:auto"> Add new stations and update existing ones</label>
        <label style="display:block"><input type="radio" name="mode" value="replace" style="width:auto"> Replace everything, and remove stations that are not in the file</label></div>
        <div class="prog" id="ip" hidden><i></i></div><div class="hint" id="it"></div><div class="err" id="ie"></div>`,
      actions: [
        { label: 'Cancel', id: 'cancel', onClick: (x) => x.close() },
        { label: `Import ${rows.length} stations`, kind: 'primary', id: 'go', onClick: run }
      ]
    });
    if (!rows.length) m.buttons.go.disabled = true;

    async function run(x, btn) {
      const replace = x.el.querySelector('input[name=mode]:checked').value === 'replace';
      if (replace) {
        const stale = state.stations.filter((s) => !used.has(s.id)).length;
        const ok = await confirmBox({ title: 'Replace all stations', message: `${stale} stations that are not in the file will be deleted. Continue?`, okLabel: 'Replace', danger: true });
        if (!ok) return;
      }
      x.locked = true; btn.disabled = true; x.buttons.cancel.disabled = true;
      const bar = x.el.querySelector('#ip'), txt = x.el.querySelector('#it'); bar.hidden = false;
      try {
        await writeStations(rows, { replace, onProgress: (a, b) => { bar.firstElementChild.style.width = Math.round((a / b) * 100) + '%'; txt.textContent = `Saved ${a} of ${b}`; } });
        state.stations = await listStations();
        txt.textContent = `Done: ${rows.length} stations imported.`;
        updateTiles(); if (state.tab === 'inventory') renderInventory();
      } catch (e) { x.el.querySelector('#ie').textContent = friendlyError(e); }
      x.locked = false; x.buttons.cancel.disabled = false; x.buttons.cancel.textContent = 'Close';
    }
  }

  async function openQuantityEntry(dept, line, dateStr, existing = null) {
    let stations = await listStationsByDepartment(dept);
    stations = stations.filter(s => s.line === line);

    if (!stations.length) {
      toast('No stations found for this line.');
      return;
    }

    const isEdit = !!existing;
    const title = isEdit ? 'Edit Inventory Check' : `Enter quantities – ${line} (${dateStr})`;

    const rowsHtml = stations.map((s, i) => {
      const item = existing?.items?.find(it => it.stationId === s.id) || {};
      return `
        <tr data-i="${i}">
          <td><b>${esc(s.stationName)}</b></td>
          <td class="num">${s.min}</td>
          <td class="num">${s.max}</td>
          <td><input class="act" type="number" min="0" step="1" value="${item.actual ?? ''}" style="width:90px"></td>
          <td class="res">-</td>
          <td><input class="why" type="text" maxlength="200" value="${esc(item.reason || '')}" placeholder="Reason if Not OK" style="width:100%"></td>
        </tr>`;
    }).join('');

    const m = openModal({
      title,
      wide: true,
      html: `
        <p><b>${esc(dept)}</b> → <b>${esc(line)}</b> → Date: <b>${esc(dateStr)}</b></p>
        <div class="tbl-wrap" style="margin-top:12px"><table class="tbl">
          <thead><tr>
            <th>Station</th><th class="num">Min</th><th class="num">Max</th>
            <th>Actual</th><th>Result</th><th>Reason if Not OK</th>
          </tr></thead>
          <tbody id="qrows">${rowsHtml}</tbody>
        </table></div>
        <div class="err" id="qerr" style="margin-top:12px"></div>`,
      actions: [
        { label: 'Cancel', onClick: x => x.close() },
        { label: isEdit ? 'Save Changes' : 'Save Check', kind: 'primary', onClick: save }
      ]
    });

    const tbody = m.el.querySelector('#qrows');
    tbody.addEventListener('input', (e) => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      updateRow(tr);
    });

    function updateRow(tr) {
      const act = tr.querySelector('.act');
      const res = tr.querySelector('.res');
      const i = Number(tr.dataset.i);
      const s = stations[i];
      const val = act.value.trim();
      if (val === '') {
        res.innerHTML = '-';
        tr.classList.remove('bad');
        return;
      }
      const n = Number(val);
      if (!Number.isInteger(n) || n < 0) {
        res.innerHTML = '<span class="badge bad">Invalid</span>';
        return;
      }
      if (n >= s.min && n <= s.max) {
        res.innerHTML = '<span class="badge ok">OK</span>';
        tr.classList.remove('bad');
      } else {
        res.innerHTML = `<span class="badge bad">Not OK</span>`;
        tr.classList.add('bad');
      }
    }

    tbody.querySelectorAll('tr').forEach(updateRow);

    async function save(x, btn) {
      const err = m.el.querySelector('#qerr');
      err.textContent = '';
      const items = [];
      let hasError = false;

      tbody.querySelectorAll('tr').forEach((tr, i) => {
        const s = stations[i];
        const actualStr = tr.querySelector('.act').value.trim();
        const reason = tr.querySelector('.why').value.trim();
        if (actualStr === '') {
          hasError = true;
          tr.querySelector('.act').style.borderColor = 'red';
          return;
        }
        const actual = Number(actualStr);
        if (!Number.isInteger(actual) || actual < 0) {
          hasError = true;
          return;
        }
        const status = (actual >= s.min && actual <= s.max) ? 'OK' : 'Not OK';
        if (status === 'Not OK' && reason.length < 3) {
          hasError = true;
          tr.querySelector('.why').style.borderColor = 'red';
        }
        items.push({
          stationId: s.id,
          stationName: s.stationName,
          stationCode: s.stationCode || '',
          min: s.min,
          max: s.max,
          actual,
          status,
          reason: status === 'Not OK' ? reason : ''
        });
      });

      if (hasError) {
        err.textContent = 'Please fill all quantities. For Not OK stations, enter a reason (min 3 characters).';
        return;
      }

      btn.disabled = true;
      x.locked = true;

      try {
        if (isEdit) {
          const okCount = items.filter(i => i.status === 'OK').length;
          await updateInventoryCheck(existing.id, {
            items,
            okCount,
            notOkCount: items.length - okCount,
            total: items.length
          });
          const idx = state.checks.findIndex(c => c.id === existing.id);
          if (idx >= 0) {
            state.checks[idx] = { ...state.checks[idx], items, okCount, notOkCount: items.length - okCount, total: items.length };
          }
          toast('Check updated.');
        } else {
          const saved = await saveInventoryCheck({
            department: dept,
            line,
            items,
            name: ctx.name,
            employeeId: ctx.employeeId,
            dateKey: dateStr,
            extra: { source: 'admin-past' }
          });
          state.checks.unshift(saved);
          state.checks.sort((a, b) => checkKey(b).localeCompare(checkKey(a)));
          toast('Past check saved.');
        }
        x.locked = false;
        x.close();
        updateTiles();
        if (state.tab === 'history') drawHistory();
      } catch (e) {
        err.textContent = friendlyError(e);
        btn.disabled = false;
        x.locked = false;
      }
    }
  }

  async function editCheck(id) {
    const c = await getInventoryCheck(id);
    if (!c) { toast('Check not found'); return; }
    const dateStr = c.dateKey || (c.createdAt?.toDate?.()?.toISOString().slice(0,10)) || '';
    openQuantityEntry(c.department, c.line, dateStr, c);
  }

  /* ---------- Import Past Checks ---------- */
  // Accepts two layouts:
  //  1) one row per station per date: Date | Department | Line | Station Name | Actual | Reason
  //  2) the Export layout: Department | Line | Station | Min | Max | <one column per date> | Compliance % | Unique Reasons
  async function readPastSheet(file) {
    try { return await readSheet(file, ['date', 'department', 'line', 'stationname', 'actual']); } catch { /* try the export layout */ }
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    for (const name of wb.SheetNames) {
      const grid = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
      const head = grid[0] || [], keys = head.map(nk);
      const iD = keys.indexOf('department'), iL = keys.indexOf('line');
      const iS = keys.findIndex((k) => k === 'station' || k === 'stationname');
      if (iD < 0 || iL < 0 || iS < 0) continue;
      const iR = keys.findIndex((k) => k === 'uniquereasons' || k === 'reason' || k === 'reasons');
      const stripShift = (h) => (typeof h === 'string' ? h.replace(/\s*[-|]?\s*shift\s*[123]\b.*$/i, '').trim() : h);
      const dateCols = head.map((h, i) => (i !== iD && i !== iL && i !== iS && parseExcelDate(stripShift(h)) ? i : -1)).filter((i) => i >= 0);
      if (!dateCols.length) continue;
      const rows = [];
      grid.slice(1).forEach((r, n) => {
        dateCols.forEach((i) => {
          if (String(r[i] ?? '').trim() === '') return;     // no check on that date for this station
          rows.push({ date: stripShift(head[i]), department: r[iD], line: r[iL], stationname: r[iS], actual: r[i], reason: iR >= 0 ? r[iR] : '', _row: n + 2 });
        });
      });
      return { sheet: name, rows };
    }
    throw new Error('Could not find the expected columns. Use Date, Department, Line, Station Name, Actual, or the Export layout with one column per date.');
  }

  async function importPastChecks() {
    const file = await pickFile();
    if (!file) return;

    let parsed;
    try {
      parsed = await readPastSheet(file);
    } catch (e) {
      toast(e.message);
      return;
    }

    // Group by Date + Department + Line
    const groups = {};
    const errors = [];

    parsed.rows.forEach((r, idx) => {
      const date = parseExcelDate(r.date);
      const dept = fixDept(r.department);
      const line = clean(r.line);
      const stationName = clean(r.stationname);
      const actual = Number(r.actual);
      const reason = clean(r.reason || r.reasonifnotok || '');

      if (!dept || !line || !stationName || String(r.date ?? '').trim() === '') {
        errors.push(`Row ${r._row || idx + 2}: Missing Date / Department / Line / Station`);
        return;
      }
      if (!date) {
        errors.push(`Row ${r._row || idx + 2}: Date "${r.date}" not understood. Use dd-mm-yyyy, for example 05-11-2026`);
        return;
      }
      if (date > localKey(new Date())) {
        errors.push(`Row ${r._row || idx + 2}: Date ${date} is in the future`);
        return;
      }
      if (!Number.isFinite(actual)) {
        errors.push(`Row ${r._row || idx + 2}: Actual is not a number`);
        return;
      }

      const key = `${date}|${dept}|${line}`;
      if (!groups[key]) groups[key] = { date, department: dept, line, items: [] };
      const prev = groups[key].items.findIndex(x => x.stationName === stationName);
      if (prev >= 0) groups[key].items.splice(prev, 1);   // several shift columns for one date: the later shift wins
      groups[key].items.push({ stationName, actual, reason });
    });

    // A check that already exists for the same date, department and line is skipped (no duplicates)
    const have = new Set(state.checks.map(c => `${checkKey(c)}|${c.department}|${c.line}`));
    const all = Object.values(groups);
    const groupList = all.filter(g => !have.has(`${g.date}|${g.department}|${g.line}`));
    const dups = all.length - groupList.length;
    if (!all.length) {
      toast(errors[0] || 'No valid rows found in the file.');
      return;
    }
    const days = groupList.map(g => g.date).sort();
    const batchId = 'imp-' + Date.now().toString(36);
    const unmatched = new Set();

    const m = openModal({
      title: 'Import Past Checks',
      wide: true,
      html: `
        <p>Found <b>${groupList.length}</b> checks to import (${parsed.rows.length} rows).</p>
        ${groupList.length ? `<p>Check dates: <b>${esc(fmtDay(days[0]))}</b> to <b>${esc(fmtDay(days[days.length - 1]))}</b></p>` : ''}
        ${dups ? `<p class="hint">${dups} checks already exist for the same date, department and line, so they will be skipped.</p>` : ''}
        ${errors.length ? `<p class="hint" style="color:#b91c1c">${errors.length} rows had problems and were skipped:<br>${errors.slice(0, 5).map(esc).join('<br>')}</p>` : ''}
        <div class="prog" id="ip" hidden><i></i></div>
        <div class="hint" id="it"></div>
        <div class="err" id="ie"></div>`,
      actions: [
        { label: 'Cancel', id: 'cancel', onClick: x => x.close() },
        { label: `Import ${groupList.length} checks`, kind: 'primary', id: 'go', onClick: run }
      ]
    });
    if (!groupList.length) m.buttons.go.disabled = true;

    async function run(x, btn) {
      x.locked = true;
      btn.disabled = true;
      x.buttons.cancel.disabled = true;
      const bar = x.el.querySelector('#ip');
      const txt = x.el.querySelector('#it');
      bar.hidden = false;

      let success = 0, fail = 0;

      for (let i = 0; i < groupList.length; i++) {
        const g = groupList[i];
        txt.textContent = `Importing ${i + 1} of ${groupList.length}: ${g.department} - ${g.line} (${g.date})`;
        bar.firstElementChild.style.width = Math.round(((i + 1) / groupList.length) * 100) + '%';

        try {
          // Get current stations for min/max
          const stations = await listStationsByDepartment(g.department);
          const lineStations = stations.filter(s => s.line === g.line);

          const items = [];
          for (const row of g.items) {
            const st = lineStations.find(s => s.stationName.toLowerCase() === row.stationName.toLowerCase());
            if (!st) { unmatched.add(row.stationName); continue; }

            const status = (row.actual >= st.min && row.actual <= st.max) ? 'OK' : 'Not OK';
            items.push({
              stationId: st.id,
              stationName: st.stationName,
              stationCode: st.stationCode || '',
              min: st.min,
              max: st.max,
              actual: row.actual,
              status,
              reason: status === 'Not OK' ? row.reason : ''
            });
          }

          if (items.length === 0) {
            fail++;
            continue;
          }

          await saveInventoryCheck({
            department: g.department,
            line: g.line,
            items,
            name: ctx.name + ' (Import)',
            employeeId: ctx.employeeId,
            dateKey: g.date,
            extra: { imported: true, importBatch: batchId }
          });
          success++;
        } catch (e) {
          fail++;
          console.error(e);
        }
      }

      // Reload checks
      state.checks = await listInventoryChecks();
      state.loaded.checks = true;

      txt.textContent = `Done: ${success} checks imported, ${fail} failed.` +
        (unmatched.size ? ` Station names not found and skipped: ${[...unmatched].slice(0, 6).join(', ')}${unmatched.size > 6 ? '…' : ''}` : '');
      x.locked = false;
      x.buttons.cancel.disabled = false;
      x.buttons.cancel.textContent = 'Close';
      updateTiles();
      if (state.tab === 'history') drawHistory();
    }
  }

  /* ---------- Delete imported checks in bulk ---------- */
  async function cleanupImports() {
    let fresh;
    try { fresh = await listInventoryChecks(); } catch (e) { toast(friendlyError(e)); return; }
    state.checks = fresh; state.loaded.checks = true; updateTiles(); drawHistory();
    const imported = fresh.filter(c => c.imported || /\(Import\)\s*$/.test(c.name || ''));
    if (!imported.length) { toast('There are no imported checks.'); return; }
    // Imports made before this fix have no batch id and were saved with the upload date
    const groups = {};
    imported.forEach(c => { const k = c.importBatch || 'legacy'; (groups[k] = groups[k] || []).push(c); });
    const list = Object.entries(groups).map(([k, items]) => {
      const keys = items.map(checkKey).sort();
      const up = items.map(c => c.createdAt?.toDate?.()).filter(Boolean).sort((a, b) => a - b)[0];
      return { k, items, legacy: k === 'legacy',
        label: k === 'legacy' ? 'Earlier imports (saved with the upload date instead of the Excel date)' : 'Import done on ' + (up ? up.toLocaleString('en-IN') : k),
        span: keys[0] === keys[keys.length - 1] ? fmtDay(keys[0]) : fmtDay(keys[0]) + ' to ' + fmtDay(keys[keys.length - 1]) };
    }).sort((a, b) => b.legacy - a.legacy);

    const m = openModal({
      title: 'Delete imported checks', wide: true,
      html: `<p>Choose which imports to delete. Checks entered by users and added by hand are not touched.</p>
        <table class="sum"><tr><th></th><th>Import</th><th>Checks</th><th>Check dates</th></tr>
        ${list.map((g, i) => `<tr><td><input type="checkbox" class="g" data-i="${i}" ${g.legacy ? 'checked' : ''} style="width:auto" aria-label="Select"></td>
          <td>${esc(g.label)}</td><td>${g.items.length}</td><td>${esc(g.span)}</td></tr>`).join('')}</table>
        <div class="prog" id="ip" hidden><i></i></div><div class="hint" id="it"></div><div class="err" id="ie"></div>`,
      actions: [
        { label: 'Cancel', id: 'cancel', onClick: x => x.close() },
        { label: 'Delete selected', kind: 'danger', id: 'go', onClick: run }
      ]
    });
    async function run(x, btn) {
      const ids = [...x.el.querySelectorAll('.g:checked')].flatMap(el => list[+el.dataset.i].items.map(c => c.id));
      if (!ids.length) { x.el.querySelector('#ie').textContent = 'Select at least one import.'; return; }
      const sure = await confirmBox({ title: 'Delete imported checks', message: `${ids.length} checks will be permanently deleted. Continue?`, okLabel: 'Delete', danger: true });
      if (!sure) return;
      x.locked = true; btn.disabled = true; x.buttons.cancel.disabled = true;
      const bar = x.el.querySelector('#ip'), txt = x.el.querySelector('#it'); bar.hidden = false;
      try {
        await deleteInventoryChecksBulk(ids, (a, b) => { bar.firstElementChild.style.width = Math.round((a / b) * 100) + '%'; txt.textContent = `Deleted ${a} of ${b}`; });
        state.checks = await listInventoryChecks();
        txt.textContent = `Done: ${ids.length} checks deleted.`;
        updateTiles(); if (state.tab === 'history') drawHistory();
      } catch (e) { x.el.querySelector('#ie').textContent = friendlyError(e); btn.disabled = false; }
      x.locked = false; x.buttons.cancel.disabled = false; x.buttons.cancel.textContent = 'Close';
    }
  }

  /* ---------- Export (Pivoted format with Compliance %) ---------- */
  async function exportHistory() {
    // Load XLSX if needed
    try {
      await loadXLSX();
    } catch (e) {
      toast(e.message);
      return;
    }

    // Use currently filtered data
    const d = panel.querySelector('#hd')?.value || '';
    const l = panel.querySelector('#hl')?.value || '';
    const from = panel.querySelector('#hfrom')?.value || '';
    const to = panel.querySelector('#hto')?.value || '';
    const u = panel.querySelector('#hu')?.value || '';

    let list = state.checks.slice();
    if (u) list = list.filter(c => String(c.employeeId) === u);
    if (d) list = list.filter(c => c.department === d);
    if (l) list = list.filter(c => c.line === l);
    if (from) list = list.filter(c => checkKey(c) >= from);
    if (to) list = list.filter(c => checkKey(c) <= to);

    if (!list.length) {
      toast('No data to export for the selected filters.');
      return;
    }

    // Oldest first, so when a station is checked twice in one shift the later entry is shown
    list.sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    // Columns: every date has three shift columns
    const dateSet = new Set();
    list.forEach(c => { const k = shiftOf(c).day; if (k) dateSet.add(k); });
    const dates = [...dateSet].sort();
    // Only shift columns that have at least one entry
    const used = new Set(list.map(c => { const sh = shiftOf(c); return sh.day ? `${sh.day}|${sh.shift}` : ''; }));
    const cols = dates.flatMap(d => [1, 2, 3].map(n => `${d}|${n}`)).filter(k => used.has(k));

    // Build station map: key = department|line|stationName
    const stationMap = {};

    list.forEach(c => {
      const sh = shiftOf(c);
      const dateKey = sh.day ? `${sh.day}|${sh.shift}` : '';
      if (!dateKey) return;

      (c.items || []).forEach(item => {
        const key = `${c.department}|${c.line}|${item.stationName}`;
        if (!stationMap[key]) {
          stationMap[key] = {
            department: c.department,
            line: c.line,
            station: item.stationName,
            min: item.min,
            max: item.max,
            dates: {},
            okCount: 0,
            totalCount: 0,
            reasons: new Set(),
            by: new Set()
          };
        }
        const s = stationMap[key];
        s.dates[dateKey] = item.actual;
        s.totalCount++;
        if (item.status === 'OK') s.okCount++;
        if (item.reason) s.reasons.add(item.reason);
        if (c.name) s.by.add(String(c.name).replace(/\s*\(Import\)\s*$/, ''));
      });
    });

    // Build Excel data
    const header = ['Department', 'Line', 'Station', 'Min', 'Max', ...cols.map(k => {
      const [d, n] = k.split('|');
      return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' }) + ' Shift ' + n;
    }), 'Compliance %', 'Unique Reasons', 'Submitted by'];

    const rows = Object.values(stationMap).map(s => {
      const compliance = s.totalCount ? Math.round((s.okCount / s.totalCount) * 100) : 0;
      return [
        s.department,
        s.line,
        s.station,
        s.min,
        s.max,
        ...cols.map(k => s.dates[k] ?? ''),
        compliance,
        [...s.reasons].join(', '),
        [...s.by].join(', ')
      ];
    });

    // Sort
    rows.sort((a, b) => a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]) || a[2].localeCompare(b[2]));

    const X = window.XLSX;
    const ws = X.utils.aoa_to_sheet([header, ...rows]);
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Inventory History');
    // Second sheet: one row per station per check, with who submitted it and when
    const det = [['Date', 'Shift', 'Time', 'Department', 'Line', 'Station', 'Min', 'Max', 'Actual', 'Status', 'Reason', 'Submitted by', 'Employee ID', 'Entry type']];
    list.slice().sort((a, b) => String(shiftOf(a).day).localeCompare(String(shiftOf(b).day)) || shiftOf(a).shift - shiftOf(b).shift || (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0)).forEach(c => {
      const live = !c.backdated && !c.imported && c.createdAt?.toDate;
      const time = live ? c.createdAt.toDate().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
      (c.items || []).forEach(i => det.push([shiftOf(c).day, 'Shift ' + shiftOf(c).shift, time, c.department, c.line, i.stationName, Number(i.min), Number(i.max), Number(i.actual), i.status, i.reason || '',
        String(c.name || '').replace(/\s*\(Import\)\s*$/, ''), c.employeeId || '', c.imported ? 'Imported' : c.backdated ? 'Past entry' : 'Submitted']));
    });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(det), 'Check details');
    X.writeFile(wb, `Inventory_History_${new Date().toISOString().slice(0,10)}.xlsx`);

    toast('Export completed.');
  }
